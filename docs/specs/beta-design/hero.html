<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 소개 페이지 첫 화면 시안 (그림 원본). site/index.html 변수·클래스 그대로. 파란 동그라미 번호 = 문서의 설명 번호 -->
<style>
:root{--bg:#0b0c10;--panel:#12141b;--panel2:#181b24;--line:#232733;--line2:#2e3342;--fg:#eef0f5;--muted:#9097a8;--dim:#636a7b;--accent:#7c9cff;--accent2:#5eead4;--beta:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);line-height:1.6;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.top{border-bottom:1px solid var(--line)}.top .wrap{display:flex;align-items:center;gap:28px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.logo img{width:28px;height:28px}
.top nav{display:flex;gap:24px;font-size:14px;color:var(--muted)}
.top .right{margin-left:auto;display:flex;gap:10px}
.pill{border:1px solid var(--line2);border-radius:8px;font-size:13px;padding:6px 10px;color:var(--muted)}
.hero{padding:72px 0 0;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-10% -20% auto;height:820px;z-index:-1;background:radial-gradient(50% 50% at 50% 30%,rgba(124,156,255,.16),transparent 70%)}
.appicon{display:block;width:72px;height:72px;margin:0 auto 22px;filter:drop-shadow(0 12px 32px rgba(124,156,255,.35))}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;color:var(--muted);margin-bottom:24px}
.badge b{background:rgba(124,156,255,.14);color:var(--accent);border-radius:99px;padding:1px 8px}
h1{font-size:clamp(34px,5.6vw,60px);line-height:1.12;font-weight:700;letter-spacing:-.03em;max-width:880px;margin:0 auto;position:relative;
  background:linear-gradient(180deg,#fff 30%,#b9c4e6);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text}
.slot{outline:2px dashed rgba(124,156,255,.6);outline-offset:10px;border-radius:6px}
.lead{font-size:clamp(16px,2vw,19px);color:var(--muted);max-width:640px;margin:20px auto 0}
.cta{margin-top:32px;display:flex;justify-content:center}
.big{display:inline-flex;align-items:center;gap:12px;height:60px;padding:0 30px;border-radius:14px;background:var(--fg);color:#0b0c10;font-weight:700;font-size:18px;box-shadow:0 10px 40px -8px rgba(124,156,255,.45)}
.big svg{width:22px;height:22px}.big small{font-weight:500;opacity:.6;font-size:14px}
.sub{margin-top:10px;font-size:13px;color:var(--dim)}
.meta{margin:18px auto 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.meta a{color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.meta .sep{width:1px;height:14px;background:var(--line2)}
.beta{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--beta);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:6px;padding:1px 7px}
.plat{display:inline-flex;gap:6px;align-items:center}
.shot{margin:56px auto 0;max-width:1100px;border:1px solid var(--line2);border-bottom:0;border-radius:14px 14px 0 0;overflow:hidden;background:var(--panel);height:260px}
.shot img{width:100%;display:block}
.n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#3b82f6;color:#fff;font:700 11px/1 sans-serif;-webkit-text-fill-color:#fff;vertical-align:middle;margin:0 2px}
h1 .n{position:absolute;left:-28px;top:6px}
@media (max-width:600px){
  .top nav{display:none}.hero{padding-top:44px}.appicon{width:60px;height:60px}
  .big{width:100%;justify-content:center;height:56px;font-size:17px}.cta{padding:0 4px}
  .meta{gap:8px 10px;font-size:13px}.meta .sep.hideM{display:none}.meta .brk{flex-basis:100%;height:0}
  h1 .n{left:-4px;top:-22px}.shot{height:200px;margin-top:40px}
  h1{font-size:29px}.top .right .pill:last-child{display:none}.badge{font-size:12px;flex-wrap:wrap;justify-content:center}.big small{display:none}
}
</style></head><body>
<header class="top"><div class="wrap">
  <span class="logo"><img src="../../../site/assets/icon.png" alt=""><span>AI Office</span></span>
  <nav><span>사용법</span><span>기능</span><span>꾸미기</span><span>휴대폰</span><span>다운로드</span><span>FAQ</span></nav>
  <div class="right"><span class="pill">한국어 ▾</span><span class="pill">GitHub</span></div>
</div></header>
<section class="hero"><div class="wrap">
  <img class="appicon" src="../../../site/assets/icon.png" alt="AI Office">
  <div class="badge"><b>v0.14.2</b><span>무료 · 오픈소스 · 맥·윈도우·안드로이드</span></div>
  <h1 class="slot"><span class="n">1</span>코드 없이 AI 직원을 고용하는<br><em>AI 사무실</em>, AI Office</h1>
  <p class="lead">Claude 직원과 GPT 직원을 한 사무실에 뽑아 일을 맡기세요. 중요한 일은 결재함에서 확인하고, 끝나면 보고를 받아요.</p>
  <div class="cta"><a class="big"><span class="n">2</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.3 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.6-1-2.6-4.2zM13.9 5c.7-.8 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>맥용 무료 다운로드 <small>.dmg · Apple Silicon</small></a></div>
  <div class="meta">
    <span class="plat"><span class="n">3</span>다른 플랫폼: <a>Windows</a> · <a>Android</a></span>
    <span class="sep hideM"></span><span class="brk"></span>
    <span class="beta"><span class="n" style="margin-left:-2px;margin-right:5px">4</span>BETA</span>
    <a>알려진 제한 사항</a>
    <span class="sep"></span>
    <a>피드백 보내기 ↗</a>
  </div>
  <div class="shot"><img src="../../../site/assets/screens/ko/office.webp" alt=""></div>
</div></section>
</body></html>
