<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>업무 모드 스위치 — 위치 시안</title>
<!-- 디자인 시안 전용(앱 코드 아님). ?v=1|2|3|4 &mode=dark|light 로 연다.
     근거 코드: App.tsx DesktopShell(상단 44px 바 · 업무 모드면 자금 칩 숨김), Sidebar.tsx(업무 모드면 사무실·상점 메뉴 뺌, 아래 의견 보내기),
     store.ts shownView(업무 모드면 사무실 → 대시보드), SettingsPage.tsx·featuresB.ts settingsPage.workMode.*(체크박스 '업무 모드 사용').
     색은 chat-tabs.html과 같은 사무실 토큰. 이름·숫자는 예시 -->
<style>
  [data-mode='light'] {
    --background:#F6F5FB; --foreground:#221F33; --card:#FFFFFF; --primary:#6C5CE7; --on-primary:#FFFFFF;
    --muted:#ECEAF6; --muted-foreground:#66627F; --accent:#E9E6FA; --border:#DEDAF0; --input:#CFCAE6;
    --chrome:#FBFAFF; --working:#1C7C46; --waiting:#9A5B00; --waiting-bg:#F2C94C; --error:#C42B2B;
    --me:#6C5CE7; --sheet-bg:#E4E1F2; --frame:#c9c4e0; --hl:#E5484D; --floor:#d9d3ea; --floor2:#cfc8e3;
  }
  [data-mode='dark'] {
    --background:#14131C; --foreground:#EDEBF8; --card:#201F2D; --primary:#9B8CFF; --on-primary:#1A1240;
    --muted:#292739; --muted-foreground:#A7A3C4; --accent:#302D47; --border:#34314A; --input:#413E5C;
    --chrome:#181723; --working:#4ADE80; --waiting:#F2C94C; --waiting-bg:#F2C94C; --error:#FF6B6B;
    --me:#7B6CF0; --sheet-bg:#0C0B12; --frame:#2a2838; --hl:#FF8A8F; --floor:#2b2638; --floor2:#322c41;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--sheet-bg); }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--foreground); padding: 26px 30px 30px; width: 1500px; font-size: 13px; }
  h1 { font-size: 22px; display: flex; gap: 10px; align-items: center; }
  .rec { font-size: 11px; font-weight: 800; background: var(--primary); color: var(--on-primary); border-radius: 999px; padding: 3px 9px; }
  .lead { color: var(--muted-foreground); font-size: 13.5px; margin: 6px 0 16px; line-height: 1.6; }
  .row { display: flex; gap: 24px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .st { font-size: 14px; font-weight: 800; display: flex; gap: 8px; align-items: center; }
  .st small { font-weight: 500; color: var(--muted-foreground); font-size: 12px; }
  .pc { display: flex; gap: 14px; margin-top: 16px; }
  .pc .card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 13px; line-height: 1.6; }
  .pc .card b.g { color: var(--working); } .pc .card b.b { color: var(--error); }

  svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .win { width: 710px; height: 450px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--background); border: 1px solid var(--frame); box-shadow: 0 18px 36px -18px rgba(40,30,90,.45); position: relative; }
  .appbar { height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding: 0 12px 0 56px; background: var(--card); border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 700; position: relative; }
  .lights { position: absolute; left: 12px; top: 12px; display: flex; gap: 5px; } .lights i { width: 9px; height: 9px; border-radius: 50%; background: #5a566e; }
  .appbar .sp { flex: 1; } .ib { height: 22px; padding: 0 8px; border-radius: 999px; background: var(--muted); display: inline-flex; gap: 4px; align-items: center; font-size: 10.5px; white-space: nowrap; }
  .ib.p { background: var(--primary); color: var(--on-primary); } .ib.o { background: transparent; border: 1px solid var(--border); }
  .body { display: flex; flex: 1; min-height: 0; }
  .nav { width: 112px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; }
  .nav span.m { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 8px; color: var(--muted-foreground); }
  .nav span.m.on { background: var(--accent); color: var(--foreground); font-weight: 700; }
  .nav b.n { margin-left: auto; background: var(--waiting-bg); color: #241a00; border-radius: 999px; padding: 0 5px; font-size: 9.5px; }
  .nav .fill { flex: 1; } .nav .fb { font-size: 10.5px; color: var(--muted-foreground); padding: 5px 7px; display: flex; gap: 5px; align-items: center; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* 스위치 (shadcn Switch 비율) */
  .sw { width: 26px; height: 15px; border-radius: 999px; background: var(--input); position: relative; flex-shrink: 0; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; }
  .sw.on { background: var(--primary); } .sw.on::after { left: 13px; background: var(--on-primary); }
  .wm { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .wm.on { color: var(--primary); }
  /* ① 왼쪽 메뉴 맨 위 */
  .wm-nav { justify-content: space-between; padding: 6px 7px; border: 1px solid var(--border); border-radius: 8px; font-size: 11px; font-weight: 700; margin-bottom: 6px; background: var(--card); }
  .wm-nav.on { border-color: color-mix(in srgb, var(--primary) 55%, transparent); background: color-mix(in srgb, var(--primary) 12%, var(--card)); }
  /* ② 상단 바 — 두 칸 전환(사무실 | 업무) */
  .seg { display: inline-flex; height: 22px; border-radius: 999px; background: var(--muted); padding: 2px; font-size: 10.5px; }
  .seg span { display: inline-flex; align-items: center; gap: 3px; padding: 0 8px; border-radius: 999px; color: var(--muted-foreground); }
  .seg span.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .seg span.on.w { background: var(--primary); color: var(--on-primary); }
  /* ③ 대화방 머리 */
  .head { padding: 9px 12px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .head .t { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
  .head .t .sp { flex: 1; } .head .t .ic { color: var(--muted-foreground); }
  .head .s { margin-top: 6px; display: flex; gap: 5px; align-items: center; font-size: 10.5px; color: var(--muted-foreground); }
  .wm-chat { font-size: 10.5px; font-weight: 700; border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px 2px 8px; }
  .wm-chat.on { border-color: color-mix(in srgb, var(--primary) 55%, transparent); }
  /* ④ 왼쪽 메뉴 맨 아래 */
  .wm-foot { justify-content: space-between; padding: 6px 7px; border-top: 1px solid var(--border); margin-top: 4px; font-size: 11px; font-weight: 700; }

  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; display: inline-flex; gap: 4px; align-items: center; font-size: 10px; color: var(--foreground); }
  .wk { color: var(--working); font-weight: 700; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; } .dot.w { background: var(--working); } .dot.q { background: var(--waiting); }
  .split { display: flex; flex: 1; min-height: 0; }
  .side { width: 120px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--chrome); padding: 7px 6px; display: flex; flex-direction: column; gap: 1px; font-size: 11px; }
  .side .g { font-size: 9.5px; color: var(--muted-foreground); padding: 5px 6px 2px; font-weight: 600; }
  .side .r { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 8px; } .side .r.on { background: var(--accent); font-weight: 700; }
  .msgs { flex: 1; padding: 10px 14px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; }
  .msg .nm { font-size: 9.5px; color: var(--muted-foreground); margin-bottom: 2px; }
  .msg .b { display: inline-block; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 5px 9px; font-size: 11px; max-width: 320px; line-height: 1.45; }
  .msg.me { text-align: right; } .msg.me .b { background: var(--me); color: #fff; border-color: transparent; }
  .composer { margin: 0 12px 10px; border: 1px solid var(--input); border-radius: 10px; background: var(--card); padding: 7px 10px; font-size: 10.5px; color: var(--muted-foreground); }

  /* 사무실 지도(게임 화면) — 간단한 바닥 타일 */
  .map { flex: 1; position: relative; overflow: hidden; background: var(--background); }
  .floor { position: absolute; left: 50%; top: 52%; width: 380px; height: 380px; transform: translate(-50%,-50%) rotateX(60deg) rotateZ(45deg);
    background: repeating-conic-gradient(var(--floor) 0 25%, var(--floor2) 0 50%) 0 0/38px 38px; border: 3px solid #5b4a6e; }
  .desk { position: absolute; width: 40px; height: 22px; border-radius: 3px; background: #8a6a4a; box-shadow: 0 6px 0 #5e4630; }
  .pp { position: absolute; width: 12px; height: 18px; border-radius: 6px 6px 3px 3px; }
  .bub { position: absolute; font-size: 9.5px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 2px 6px; white-space: nowrap; }
  .lvl { position: absolute; left: 10px; top: 10px; font-size: 10.5px; font-weight: 700; display: flex; gap: 5px; }
  /* 대시보드(업무 화면) */
  .dash { flex: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 12px; height: 30px; align-items: flex-end; flex-shrink: 0; }
  .tabs span { padding: 0 8px 7px; font-size: 11.5px; color: var(--muted-foreground); border-bottom: 2px solid transparent; }
  .tabs span.on { color: var(--foreground); font-weight: 700; border-color: var(--primary); }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 6px 8px; font-size: 9.5px; color: var(--muted-foreground); }
  .kpi b { display: block; font-size: 14px; color: var(--foreground); margin-top: 2px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sc { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 7px 8px; font-size: 10px; display: flex; flex-direction: column; gap: 3px; }
  .sc .h { display: flex; gap: 6px; align-items: center; } .sc .av { width: 22px; height: 22px; border-radius: 6px; color: #fff; font-size: 8.5px; font-weight: 800; display: grid; place-items: center; }
  .sc .nm { font-weight: 800; font-size: 11px; } .sc .r { color: var(--muted-foreground); } .sc .stt { margin-left: auto; font-size: 9px; display: flex; gap: 3px; align-items: center; }

  .mark { position: absolute; border: 2px dashed var(--hl); border-radius: 8px; pointer-events: none; }
  .pin { position: absolute; background: var(--hl); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 2px 8px; white-space: nowrap; z-index: 2; }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="lead" id="lead"></p>
<div class="row">
  <div class="col"><div class="st">꺼짐 <small id="offcap"></small></div><div class="win" id="w-off"></div></div>
  <div class="col"><div class="st">켜짐 <small id="oncap"></small></div><div class="win" id="w-on"></div></div>
</div>
<div class="pc"><div class="card" id="pro"></div><div class="card" id="con"></div></div>

<script>
  const q = new URLSearchParams(location.search)
  const mode = q.get('mode') === 'light' ? 'light' : 'dark'
  const v = q.get('v') || '2'
  document.documentElement.dataset.mode = mode
  const I = {
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
    brief: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/>',
    game: '<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15.5 12h.01M18 13.5h.01"/>',
    msg: '<path d="M4 5h16v11H9l-5 4z"/>',
  }
  const ic = (k, s = 13) => `<svg viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${I[k]}</svg>`
  const sw = (on) => `<i class="sw ${on ? 'on' : ''}"></i>`

  // 스위치 모양 4가지
  const T = {
    nav: (on) => `<div class="wm wm-nav ${on ? 'on' : ''}" data-k="wm"><span class="wm ${on ? 'on' : ''}">${ic('brief')}업무 모드</span>${sw(on)}</div>`,
    bar: (on) => `<span class="seg" data-k="wm"><span class="${on ? '' : 'on'}">${ic('game', 12)}사무실</span><span class="${on ? 'on w' : ''}">${ic('brief', 12)}업무</span></span>`,
    chat: (on) => `<span class="wm wm-chat ${on ? 'on' : ''}" data-k="wm">${ic('brief', 12)}업무 모드 ${sw(on)}</span>`,
    foot: (on) => `<div class="wm wm-foot" data-k="wm"><span class="wm ${on ? 'on' : ''}">${ic('brief')}업무 모드</span>${sw(on)}</div>`,
  }

  const appbar = (on, slot) => `<div class="appbar"><span class="lights"><i></i><i></i><i></i></span>AI Office
    ${slot === 'bar' ? T.bar(on) : ''}
    ${on ? '' : '<span class="ib">₩1억 2,840만</span>'}<span class="ib o">플랜 42%</span>
    <span class="sp"></span><span class="ib o">🔔 확인 필요 2</span><span class="ib o">✨ 비서 ⌘K</span><span class="ib p">＋ 직원 고용</span></div>`
  const nav = (on, cur, slot) => {
    const items = ['비서', ...(on ? [] : ['사무실']), '직원', '업무 <b class="n">1</b>', '결재함 <b class="n">4</b>', '대화', '노하우', '기록', ...(on ? [] : ['상점']), '설정']
    return `<div class="nav">${slot === 'nav' ? T.nav(on) : ''}${items.map((x) => `<span class="m ${x.startsWith(cur) ? 'on' : ''}">${x}</span>`).join('')}
      <div class="fill"></div>${slot === 'foot' ? T.foot(on) : ''}<span class="fb">${ic('msg', 11)}의견 보내기</span></div>`
  }
  const map = `<div class="map"><div class="floor"></div>
    <div class="lvl"><span class="ib">Lv.4 성장하는 스타트업</span><span class="ib">2층</span></div>
    <div class="desk" style="left:150px;top:150px"></div><div class="desk" style="left:250px;top:120px"></div><div class="desk" style="left:330px;top:200px"></div><div class="desk" style="left:200px;top:250px"></div>
    <div class="pp" style="left:165px;top:132px;background:#3B9C7A"></div><div class="pp" style="left:265px;top:102px;background:#E8833A"></div>
    <div class="pp" style="left:345px;top:182px;background:#3E7BEA"></div><div class="pp" style="left:215px;top:232px;background:#E0457B"></div>
    <div class="bub" style="left:240px;top:80px">✏️ 작업 중</div><div class="bub" style="left:330px;top:160px">❓ 확인 필요</div></div>`
  const staffCard = (ab, c, n, r, st, d) => `<div class="sc"><div class="h"><span class="av" style="background:${c}">${ab}</span><div><div class="nm">${n}</div><div class="r">${r}</div></div><span class="stt"><i class="dot ${d}"></i>${st}</span></div><div class="r">안드로이드 1.1 — 화면 옮기기</div></div>`
  const dash = `<div class="tabs"><span class="on">대시보드</span><span>조직도</span></div><div class="dash">
    <div class="kpis"><div class="kpi">작업 중<b>2</b></div><div class="kpi">확인 필요<b>2</b></div><div class="kpi">오류<b>1</b></div><div class="kpi">대기<b>1</b></div><div class="kpi">오늘 완료<b>7</b></div></div>
    <div class="cards">${staffCard('디자', '#3B9C7A', '이디자', '디자이너', '확인 필요', 'q')}${staffCard('리드', '#E8833A', '정리드', '팀장', '작업 중', 'w')}${staffCard('가독', '#3E7BEA', '최가독', '프론트엔드', '작업 중', 'w')}
    ${staffCard('리뷰', '#C9A227', '한리뷰', '코드 리뷰어', '확인 필요', 'q')}${staffCard('안드', '#E0457B', '임안드', '백엔드', '대기', '')}${staffCard('기획', '#8C5BD9', '김기획', '기획자', '대기', '')}</div></div>`
  const chat = (on) => `<div class="head"><div class="t">전체 방<span class="sp"></span>${T.chat(on)}<span class="ic">${ic('info')}</span><span class="ic">${ic('search')}</span></div>
    <div class="s">7명 · <span class="wk">4명 일하는 중</span><span class="chip"><i class="dot w"></i>정리드</span><span class="chip"><i class="dot w"></i>최가독</span><span class="chip"><i class="dot q"></i>이디자 확인 필요</span></div></div>
    <div class="split"><div class="side"><div class="g">전체</div><div class="r on"><i class="dot" style="background:#9B8CFF"></i>전체 방</div><div class="g">팀</div><div class="r"><i class="dot" style="background:#3E7BEA"></i>개발팀</div><div class="r"><i class="dot" style="background:#8C5BD9"></i>디자인 팀</div><div class="g">랩</div><div class="r"><i class="dot" style="background:#3B9C7A"></i>오피스 전담 랩</div></div>
    <div class="main"><div class="msgs"><div class="msg"><div class="nm">김기획</div><div class="b">안드로이드 1.1 기획서 올렸어요.</div></div><div class="msg me"><div class="b">@개발팀 프로토콜 v2부터 시작해 주세요</div></div><div class="msg"><div class="nm">정리드</div><div class="b">@김기획 확인했어요. 시안은 @이디자 확인 뒤에 반영할게요.</div></div></div><div class="composer">메시지 (@이름·@팀·@랩·@전체 로 지시)</div></div></div>`

  const V = {
    '1': { slot: 'nav', title: '① 왼쪽 메뉴 맨 위', rec: false,
      lead: '왼쪽 메뉴 첫 줄에 "업무 모드" 스위치 칸을 둡니다. 켜면 칸이 보라색으로 물들고, 아래 메뉴에서 사무실·상점이 빠집니다.',
      pro: '<b class="g">장점</b> · 어느 화면에서든 보이고, 켜고 끄면 바로 아래 메뉴가 바뀌어 결과가 한눈에 이어집니다.',
      con: '<b class="b">단점</b> · 자주 누르지 않는 스위치가 메뉴 맨 위 가장 좋은 자리를 차지하고, 메뉴가 한 칸 아래로 밀립니다.' },
    '2': { slot: 'bar', title: '② 맨 위 상단 바 — "사무실 | 업무" 두 칸 전환', rec: true,
      lead: '앱 이름 바로 옆에 두 칸짜리 전환 버튼을 둡니다. 켜짐/꺼짐 대신 "사무실(게임) | 업무" 중 지금 어느 쪽인지 글자로 보여 줍니다. 업무로 바꾸면 옆의 자금 칩이 사라집니다.',
      pro: '<b class="g">장점</b> · 모든 화면 맨 위라 늘 보이고, 앱 전체 모습을 바꾸는 스위치라는 뜻이 자리와 맞습니다. 숨겨지는 자금 칩 바로 옆이라 무엇이 바뀌는지 같이 보입니다.',
      con: '<b class="b">단점</b> · 상단 바가 이미 꽉 차 있어 창이 좁으면 자리가 빠듯합니다(좁을 땐 아이콘만 남기기 필요). 휴대폰 화면엔 따로 자리를 정해야 합니다.' },
    '3': { slot: 'chat', title: '③ 대화방 화면 위쪽', rec: false,
      lead: '대화방 이름 줄 오른쪽(정보·검색 아이콘 옆)에 작은 스위치를 둡니다.',
      pro: '<b class="g">장점</b> · 대화를 많이 쓰는 분은 손이 가장 많이 가는 화면이라 찾기 쉽습니다.',
      con: '<b class="b">단점</b> · 앱 전체 설정인데 대화방 안에 있어 "이 방에만 적용?"으로 오해할 수 있고, 다른 화면(직원·결재함)에선 보이지 않습니다.' },
    '4': { slot: 'foot', title: '④ 왼쪽 메뉴 맨 아래 (의견 보내기 위)', rec: false,
      lead: '왼쪽 메뉴 맨 아래, "의견 보내기" 바로 위에 스위치를 둡니다. 디스코드가 내 상태·설정 버튼을 왼쪽 아래 구석에 두는 방식과 같습니다.',
      pro: '<b class="g">장점</b> · 늘 보이면서도 메뉴 순서를 건드리지 않고, 상단 바도 붐비지 않습니다. 고칠 곳이 가장 적습니다(추정).',
      con: '<b class="b">단점</b> · 눈길이 잘 가지 않는 구석이라 처음엔 있는 줄 모를 수 있습니다. 창이 낮으면 메뉴와 함께 아래로 밀립니다.' },
  }[v]
  document.getElementById('title').innerHTML = `업무 모드 스위치 위치 — ${V.title} ${V.rec ? '<span class="rec">추천</span>' : ''}`
  document.getElementById('lead').innerHTML = `${V.lead}<br>업무 모드 = 회사에서 띄워 둘 때 켜는 모드. 사무실 지도·자금·상점·레벨 같은 게임 요소를 숨기고 대시보드를 먼저 보여 줍니다(설정 문구 기준).`
  document.getElementById('pro').innerHTML = V.pro
  document.getElementById('con').innerHTML = V.con
  const isChat = V.slot === 'chat'
  document.getElementById('offcap').textContent = isChat ? '게임 화면 · 대화 메뉴' : '게임 화면 · 사무실 지도'
  document.getElementById('oncap').textContent = isChat ? '같은 대화방, 메뉴에서 사무실·상점 빠짐' : '사무실·상점·자금 숨김, 대시보드'
  const win = (on) => `${appbar(on, V.slot)}<div class="body">${nav(on, isChat ? '대화' : on ? '직원' : '사무실', V.slot)}<div class="main">${isChat ? chat(on) : on ? dash : map}</div></div>`
  document.getElementById('w-off').innerHTML = win(false)
  document.getElementById('w-on').innerHTML = win(true)
  // 스위치 자리 표시
  for (const id of ['w-off', 'w-on']) {
    const w = document.getElementById(id), el = w.querySelector('[data-k="wm"]')
    const a = w.getBoundingClientRect(), b = el.getBoundingClientRect()
    const x = b.left - a.left, y = b.top - a.top
    w.insertAdjacentHTML('beforeend', `<div class="mark" style="left:${x - 3}px;top:${y - 3}px;width:${b.width + 6}px;height:${b.height + 6}px"></div>`)
  }
</script>
</body>
</html>
