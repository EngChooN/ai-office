<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>이모지 대체 아이콘 시안 3세트</title>
<!-- 디자인 시안 전용(앱 코드 아님). 아이콘은 모두 이 파일에서 직접 그린 SVG. ?mode=light|dark -->
<style>
  [data-mode='light'] {
    --background:#F6F5FB; --foreground:#221F33; --card:#FFFFFF; --primary:#6C5CE7; --primary-foreground:#FFFFFF;
    --muted:#ECEAF6; --muted-foreground:#66627F; --accent:#E9E6FA; --border:#DEDAF0; --input:#CFCAE6; --ring:#8776FF;
    --working:#1C7C46; --waiting:#9A5B00; --error:#C42B2B; --sheet-bg:#E4E1F2; --surface-chrome:#FBFAFF; --duo: #8776FF;
  }
  [data-mode='dark'] {
    --background:#14131C; --foreground:#EDEBF8; --card:#201F2D; --primary:#9B8CFF; --primary-foreground:#1A1240;
    --muted:#292739; --muted-foreground:#A7A3C4; --accent:#302D47; --border:#34314A; --input:#413E5C; --ring:#9B8CFF;
    --working:#4ADE80; --waiting:#F2C94C; --error:#FF6B6B; --sheet-bg:#0C0B12; --surface-chrome:#181723; --duo: #9B8CFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--sheet-bg); }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--foreground); padding: 36px 40px 40px; width: max-content; }
  h1.stitle { font-size: 26px; font-weight: 700; }
  p.ssub { color: var(--muted-foreground); font-size: 14px; margin: 6px 0 22px; }
  h2.sec { font-size: 17px; font-weight: 700; margin: 6px 0 12px; }
  .grid { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 14px 18px; display: grid; grid-template-columns: 150px repeat(20, 78px); row-gap: 6px; align-items: center; }
  .grid .h { font-size: 11px; color: var(--muted-foreground); text-align: center; line-height: 1.25; padding-bottom: 6px; border-bottom: 1px solid var(--border); height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .grid .h .em { font-size: 20px; line-height: 1; }
  .grid .rl { font-size: 13px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
  .grid .rl small { font-size: 11px; color: var(--muted-foreground); font-weight: 500; }
  .cell { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; color: var(--foreground); }
  .cell .sm { opacity: .9; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--primary); color: var(--primary-foreground); }
  .tag.now { background: var(--muted-foreground); color: var(--card); }

  .shots { display: flex; gap: 22px; align-items: flex-start; }
  .shot { width: 452px; display: flex; flex-direction: column; gap: 8px; }
  .shot h3 { font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .scr { background: var(--background); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; font-size: 13px; }
  .tb { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface-chrome); }
  .tb .t { flex: 1; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--accent); white-space: nowrap; }
  .pill.ai { background: color-mix(in oklab, var(--primary) 16%, transparent); color: var(--primary); }
  .pill.wait { background: transparent; border: 1px solid var(--waiting); color: var(--waiting); }
  .body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .sysm { align-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); background: var(--muted); border-radius: 999px; padding: 4px 12px; }
  .sysm.w { color: var(--waiting); background: color-mix(in oklab, var(--waiting) 12%, var(--card)); }
  .msg { display: flex; gap: 8px; }
  .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0; background: #5C4CE3; }
  .bub { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; line-height: 1.45; }
  .qb { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .qb span { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; color: var(--muted-foreground); background: var(--card); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
  .card .ttl { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .card .ds { font-size: 12px; color: var(--muted-foreground); margin: 4px 0 8px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--card); }
  .btn.p { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; background: var(--card); }
  .toast { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; box-shadow: 0 10px 28px -14px rgba(0,0,0,.35); }
  .toast b { display: block; } .toast span { font-size: 12px; color: var(--muted-foreground); }
  .em { font-family: "Apple Color Emoji", sans-serif; }
  .pc { font-size: 12.5px; line-height: 1.5; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 9px 12px; }
  .pc div + div { margin-top: 3px; }
  .plus { color: var(--working); font-weight: 700; } .minus { color: var(--error); font-weight: 700; }
  .sizes { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search)
document.documentElement.dataset.mode = document.body.dataset.mode = q.get('mode') || 'light'
const dark = document.body.dataset.mode === 'dark'

// 아이콘 정의 (24 격자). 'F:' = 색을 채울 수 있는 닫힌 모양, 'C:cx,cy,r' 원, 'CF:' 채움 원, 'RF:x,y,w,h,rx' 채움 사각형, 'D:x,y' 점
const ICONS = [
  { id: 'done', ko: '완료·승인', em: '✅ ✓', col: '#1F9D57', d: ['CF:12,12,9', 'M8 12.4l2.8 2.8L16.2 9.6'] },
  { id: 'warn', ko: '경고', em: '⚠', col: '#D98A00', d: ['F:M10.3 4.2a2 2 0 0 1 3.4 0l7.6 13.2a2 2 0 0 1-1.7 3H4.4a2 2 0 0 1-1.7-3Z', 'M12 9.5v4.2', 'D:12,17'] },
  { id: 'reject', ko: '반려·오류', em: '⛔ 💦', col: '#D93A3A', d: ['CF:12,12,9', 'M9 9l6 6M15 9l-6 6'] },
  { id: 'ask', ko: '내 확인 필요', em: '🙋 ❓', col: '#E0702A', d: ['F:M5 4.5h14a2 2 0 0 1 2 2V15a2 2 0 0 1-2 2h-8l-4.5 3.5V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z', 'M9.8 8.8a2.3 2.3 0 1 1 3.1 2.2c-.6.2-.9.7-.9 1.3', 'D:12,14.6'] },
  { id: 'ai', ko: '자동결재·AI', em: '🤖', col: '#6C5CE7', d: ['RF:4.5,8,15,12,3.5', 'M12 8V5.2', 'C:12,4,1.2', 'D:9.4,13.2', 'D:14.6,13.2', 'M10 16.6h4', 'M2.5 12.5v3M21.5 12.5v3'] },
  { id: 'repeat', ko: '반복', em: '🔁', col: '#2F7BD9', d: ['M17 2.8l3 3-3 3', 'M4 11.2v-.7a4.7 4.7 0 0 1 4.7-4.7H20', 'M7 21.2l-3-3 3-3', 'M20 12.8v.7a4.7 4.7 0 0 1-4.7 4.7H4'] },
  { id: 'schedule', ko: '예약', em: '🕘 ⏰', col: '#2F7BD9', d: ['CF:12,13,8.2', 'M12 9v4.2l2.8 1.8', 'M4.5 4.5l2.5-2M19.5 4.5l-2.5-2'] },
  { id: 'manual', ko: '매뉴얼', em: '📘', col: '#4C5BD6', d: ['F:M5 4.8A2 2 0 0 1 7 2.8h12v14.4H7a2 2 0 0 0-2 2Z', 'M5 19.2a2 2 0 0 0 2 2h12v-4', 'M9 7.5h6M9 11h4'] },
  { id: 'lab', ko: '랩', em: '🧪', col: '#0F9C8A', d: ['F:M10.2 3v6.2L5 18.4A1.8 1.8 0 0 0 6.6 21h10.8a1.8 1.8 0 0 0 1.6-2.6L13.8 9.2V3Z', 'M8.6 3h6.8', 'M7.4 15h9.2'] },
  { id: 'meeting', ko: '회의·카드 기록', em: '📋 🗣', col: '#5F6B85', d: ['RF:4.8,4.2,14.4,17,2.4', 'M9 2.8h6v3H9z', 'M8.6 11h6.8M8.6 14.8h4.6'] },
  { id: 'plan', ko: '기획안', em: '🗂', col: '#8B4FD8', d: ['F:M3 7.2a2 2 0 0 1 2-2h4.2l2 2.2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z', 'M7.5 12.5h9M7.5 16h5.5'] },
  { id: 'money', ko: '자금·비용', em: '💰 🪙', col: '#C99A06', d: ['CF:12,12,9', 'M7.8 8.2l1.9 7.6 2.3-5.6 2.3 5.6 1.9-7.6', 'M7 12h10'] },
  { id: 'phone', ko: '휴대폰', em: '📱', col: '#5F6B85', d: ['RF:6.8,2.5,10.4,19,2.6', 'M10.8 18.4h2.4'] },
  { id: 'remote', ko: '원격·인터넷', em: '🌐', col: '#2F7BD9', d: ['CF:12,12,9', 'M3 12h18', 'M12 3c2.6 2.5 3.8 5.5 3.8 9s-1.2 6.5-3.8 9c-2.6-2.5-3.8-5.5-3.8-9S9.4 5.5 12 3Z'] },
  { id: 'pause', ko: '대기·멈춤', em: '⏸ ⏳', col: '#D98A00', d: ['CF:12,12,9', 'M10 9v6M14 9v6'] },
  { id: 'party', ko: '축하', em: '🎉 🎊', col: '#E0479A', d: ['F:M3.5 20.5 8.4 8.6l7 7Z', 'M13.5 3.2v2M20.8 10.5h-2M18.3 5.7l-1.4 1.4', 'D:10.5,4.5', 'D:19.5,15', 'M13 8.5c1-1.6 2.6-2.2 4-1.6'] },
  { id: 'trophy', ko: '업적·MVP', em: '🏆 🏅', col: '#C99A06', d: ['F:M7 3.5h10v5.3a5 5 0 0 1-10 0Z', 'M7 5.5H4.6v1.3a3 3 0 0 0 3 3', 'M17 5.5h2.4v1.3a3 3 0 0 1-3 3', 'M12 13.8v3.6', 'M8.5 21h7M9.8 17.4h4.4'] },
  { id: 'like', ko: '좋아요', em: '👍', col: '#1F9D57', d: ['F:M7 10.2v10.6H4.6A1.6 1.6 0 0 1 3 19.2v-7.4a1.6 1.6 0 0 1 1.6-1.6Z', 'M7 10.2l3.8-7a2 2 0 0 1 2.9 2.1L13 9.2h5.6a2 2 0 0 1 2 2.4l-1.5 7.4a2.3 2.3 0 0 1-2.3 1.8H7'] },
  { id: 'new', ko: '새 기능·개선', em: '✨', col: '#B04FD8', d: ['F:M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9Z', 'M18.5 15v5M16 17.5h5'] },
  { id: 'bug', ko: '오류 수정', em: '🐞 🔧', col: '#D93A3A', d: ['F:M8 10.5a4 4 0 0 1 8 0v4.8a4 4 0 0 1-8 0Z', 'M12 10.5V19', 'M4 13.5h4M16 13.5h4M5 8.8l3 1.8M19 8.8l-3 1.8M5 19.5l3-1.8M19 19.5l-3-1.8', 'M10.2 6.8 9 4.8M13.8 6.8 15 4.8'] },
]
const byId = Object.fromEntries(ICONS.map((i) => [i.id, i]))

function parts(d, mode) {
  // mode: 'line' | 'fill' (채움 모양만) | 'glyph'
  return d.map((s) => {
    const fill = s.startsWith('F:') || s.startsWith('CF:') || s.startsWith('RF:')
    if (mode === 'fill' && !fill) return ''
    const fattr = mode === 'fill' ? '' : 'fill="none"'
    if (s.startsWith('F:')) return `<path d="${s.slice(2)}" ${fattr}/>`
    if (s.startsWith('CF:') || s.startsWith('C:')) { const [cx, cy, r] = s.split(':')[1].split(','); return mode === 'fill' && !fill ? '' : `<circle cx="${cx}" cy="${cy}" r="${r}" ${fattr}/>` }
    if (s.startsWith('RF:')) { const [x, y, w, h, rx] = s.slice(3).split(','); return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" ${fattr}/>` }
    if (s.startsWith('D:')) { const [x, y] = s.slice(2).split(','); return `<path d="M${x} ${y}h.01" fill="none"/>` }
    return `<path d="${s}" fill="none"/>`
  }).join('')
}

// 세트 A — 라인: 1.75 선, 단색(글자색 따라감)
const lineIcon = (ic, size = 24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">${parts(ic.d, 'line')}</svg>`
// 세트 B — 듀오톤: 굵은 선 + 살짝 어긋난 연보라 채움(손으로 칠한 느낌)
const duoIcon = (ic, size = 24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;overflow:visible">
  <g style="fill:var(--duo);stroke:var(--duo)" stroke-width="1.6" opacity="${dark ? .6 : .42}" transform="translate(1.6 1.8)">${parts(ic.d, 'fill')}</g>
  <g stroke="currentColor" stroke-width="2.15">${parts(ic.d, 'line')}</g></svg>`
// 세트 C — 솔리드 타일: 뜻 색 둥근 사각형 + 흰 그림
const tileIcon = (ic, size = 24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
  <rect width="24" height="24" rx="7" fill="${ic.col}"/>
  <g transform="translate(4.6 4.6) scale(.617)"><g fill="#fff" stroke="#fff" stroke-width="1" opacity=".3">${parts(ic.d, 'fill')}</g><g stroke="#fff" stroke-width="2.7">${parts(ic.d, 'line')}</g></g></svg>`

const SETS = [
  { key: 'A', name: '라인', sub: '1.75 선 · 단색', fn: lineIcon, pros: '지금 쓰는 아이콘 묶음(lucide)과 굵기·모양이 같아 화면 안에서 가장 자연스러움', cons: '단색이라 뜻 구분은 글자·주변 색에 기대야 함, 개성은 가장 약함' },
  { key: 'B', name: '듀오톤', sub: '굵은 선 + 어긋난 연보라 채움', fn: duoIcon, pros: '라벤더 테마 색을 살린 손그림 느낌 — 사무실 그림의 따뜻함과 업무 화면의 단정함 사이', cons: '16px 이하에선 채움이 뭉개져 라인과 비슷해짐, 테마 6종마다 채움 색 확인 필요' },
  { key: 'C', name: '솔리드 타일', sub: '뜻 색 둥근 사각 + 흰 그림', fn: tileIcon, pros: '색만 봐도 완료·경고·자동결재가 구분되고, 이모지처럼 알록달록한 자리를 그대로 대신함', cons: '문장 사이에 많이 들어가면 화면이 시끄러움 — 알림·배지·카드 머리에만 쓰는 규칙 필요' },
]

const ems = (s) => `<span class="em">${s}</span>`
// 같은 화면을 이모지/세트별로 그린다
function screen(ic) {
  const i = (id, size = 16) => ic(byId[id], size)
  return `<div class="scr">
    <div class="tb"><span class="t">단체방</span><span class="pill ai">${i('ai', 14)} 자동결재 2시간</span><span class="pill">${i('money', 14)} 1,284만</span><span class="pill wait">${i('ask', 14)} 2</span></div>
    <div class="body">
      <span class="sysm">${i('done', 15)} 정리드의 명령 실행을 승인했어요</span>
      <span class="sysm">${i('ai', 15)} 자동결재로 3건을 처리했어요</span>
      <div class="msg"><span class="av">정</span><div><div class="bub">폴드 화면 구조 검토 끝났습니다. 시안 B가 가장 안정적이에요.</div>
        <div class="qb"><span>${i('like', 13)} 좋아요</span><span>${i('repeat', 13)} 다시 해 줘</span><span>${i('meeting', 13)} 카드로 남기기</span></div></div></div>
      <div class="card"><div class="ttl">${i('plan', 18)} 기획안 · 폴드 화면 개편</div><div class="ds">하위 업무 4개 · 디자인 → 개발 → QA</div>
        <span class="btn p">${i('done', 13)} 이대로 진행</span> <span class="btn">고쳐 줘</span></div>
      <div class="chips"><span class="chip">${i('manual', 14)} 매뉴얼 3</span><span class="chip">${i('lab', 14)} 오피스 랩</span><span class="chip">${i('schedule', 14)} 매일 09:00</span><span class="chip">${i('remote', 14)} 원격 직원</span><span class="chip">${i('phone', 14)} 휴대폰 지시</span></div>
      <span class="sysm w">${i('warn', 15)} 연결이 잠깐 끊겼어요 · 다시 잇는 중</span>
      <div class="toast">${i('party', 26)}<div><b>회사 레벨 5 달성!</b><span>새 가구 6종이 상점에 들어왔어요</span></div><span style="margin-left:auto">${i('trophy', 22)}</span></div>
    </div></div>`
}
// 현재(이모지) 버전: 같은 화면에 이모지 글자
const emojiFn = (ic, size = 16) => `<span class="em" style="font-size:${size - 1}px;line-height:1">${ic.em.split(' ')[0]}</span>`

document.getElementById('root').innerHTML = `
<h1 class="stitle">이모지 대체 아이콘 시안 · 직접 그린 3세트</h1>
<p class="ssub">박패턴 이모지 전수 조사(380곳·125종)의 "의미별 묶음"을 20개 아이콘으로 통일 · 사무실 지도 말풍선(이미 그림으로 그림)은 제외 · ${dark ? '다크' : '라이트'} 모드 · 24px 격자</p>
<h2 class="sec">아이콘 세트 (왼쪽 24px · 오른쪽 16px 실제 크기)</h2>
<div class="grid">
  <div class="h" style="align-items:flex-start">뜻 / 대체할 이모지</div>
  ${ICONS.map((ic) => `<div class="h"><span class="em">${ic.em}</span>${ic.ko}</div>`).join('')}
  ${SETS.map((s) => `<div class="rl"><span><span class="tag">세트 ${s.key}</span> ${s.name}</span><small>${s.sub}</small></div>
    ${ICONS.map((ic) => `<div class="cell">${s.fn(ic, 26)}<span class="sm">${s.fn(ic, 16)}</span></div>`).join('')}`).join('')}
</div>

<div class="shots">
