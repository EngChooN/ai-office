<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>직원 패널 장비·프로필 — 쉬운 말 + 단순화 시안</title>
<!-- 디자인 시안 전용(앱 코드 아님). ?sheet=terms|now|a|b|c 로 열어 캡처한다 -->
<style>
  :root {
    --background:#F6F5FB; --foreground:#221F33; --card:#FFFFFF; --primary:#6C5CE7; --primary-foreground:#FFFFFF;
    --muted:#ECEAF6; --muted-foreground:#66627F; --accent:#E9E6FA; --border:#DEDAF0; --input:#CFCAE6;
    --chrome:#FBFAFF; --working:#1C7C46; --waiting:#9A5B00; --idle:#8A8A80; --error:#C42B2B;
    --sheet-bg:#E4E1F2; --side1:#7B6CF0; --side2:#B58CF5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--sheet-bg); }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--foreground); padding: 32px 36px 40px; width: max-content; font-size: 13px; }
  .tabs-top { display: flex; gap: 6px; margin-bottom: 18px; }
  .tabs-top a { padding: 7px 14px; border-radius: 999px; background: var(--card); color: var(--foreground); text-decoration: none; font-weight: 600; border: 1px solid var(--border); }
  .tabs-top a.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .capture .tabs-top { display: none; }
  h1.st { font-size: 25px; font-weight: 700; }
  p.ss { color: var(--muted-foreground); font-size: 14px; margin: 6px 0 20px; max-width: 1500px; line-height: 1.5; }
  .row { display: flex; gap: 28px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 9px; }
  .col h2 { font-size: 15px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--primary); color: #fff; }
  .tag.g { background: var(--muted-foreground); }
  .metric { font-size: 12px; color: var(--muted-foreground); }
  .metric b { color: var(--foreground); font-size: 14px; }
  .notes { width: 100%; font-size: 12.5px; line-height: 1.55; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; }
  .notes li { margin-left: 16px; }

  /* ── 데스크톱 창 ── */
  .win { width: 560px; height: 880px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--background); border: 1px solid #c9c4e0; box-shadow: 0 18px 36px -18px rgba(40,30,90,.45); }
  .win .bar { height: 30px; flex-shrink: 0; background: var(--chrome); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 11px; color: var(--muted-foreground); }
  .win .bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .win .body { flex: 1; display: flex; min-height: 0; }
  .win .office { width: 180px; flex-shrink: 0; background: url(../mobile-390/office-thumb.png) center/cover, #d8d3ee; opacity: .55; }
  .win .panel { width: 380px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--background); display: flex; flex-direction: column; min-height: 0; position: relative; }

  /* ── 휴대폰 ── */
  .phone { width: 390px; height: 844px; border-radius: 30px; overflow: hidden; position: relative; background: var(--background); border: 6px solid #0d0c12; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); display: flex; flex-direction: column; }
  .sys { height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 600; background: var(--chrome); }
  .sys .cam { width: 9px; height: 9px; border-radius: 50%; background: #000; }
  .phone .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .btabs { height: 52px; flex-shrink: 0; display: flex; border-top: 1px solid var(--border); background: var(--chrome); font-size: 10.5px; color: var(--muted-foreground); }
  .btabs span { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .btabs span b { font-size: 16px; font-weight: 400; }
  .btabs span.on { color: var(--primary); font-weight: 700; }
  .gest { height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--chrome); }
  .gest i { width: 96px; height: 4px; border-radius: 2px; background: var(--muted-foreground); opacity: .5; }

  /* ── 패널 머리 ── */
  .ph { height: 54px; flex-shrink: 0; display: flex; align-items: center; gap: 9px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--chrome); }
  .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FFD6A5, #FDA4AF); display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .ph .nm { font-weight: 700; font-size: 14px; } .ph .rl { color: var(--muted-foreground); font-size: 11.5px; }
  .ph .sp { flex: 1; }
  .pill { border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600; background: var(--accent); white-space: nowrap; }
  .pill.idle::before { content: '● '; color: var(--idle); }
  .ptabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; font-size: 13px; background: var(--chrome); }
  .ptabs span { padding: 9px 12px; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .ptabs span.on { color: var(--foreground); font-weight: 600; border-color: var(--primary); }
  .content { flex: 1; overflow: hidden; position: relative; }
  .scroll { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .phone .scroll { padding: 14px 14px 24px; }
  .more { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--background) 72%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 11px; font-weight: 600; color: var(--muted-foreground); pointer-events: none; }
  .savebar { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--card); padding: 9px 14px; display: flex; align-items: center; gap: 10px; }
  .savebar .t { flex: 1; font-size: 11.5px; color: var(--muted-foreground); line-height: 1.35; }
  .savebar .t b { color: var(--foreground); }

  /* ── 부품 ── */
  .h3 { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .mut { color: var(--muted-foreground); }
  .xs { font-size: 11px; } .xxs { font-size: 10px; }
  .lead { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.5; }
  .btn { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; background: var(--primary); color: #fff; white-space: nowrap; }
  .btn.o { background: var(--card); color: var(--foreground); border: 1px solid var(--border); }
  .btn.gh { background: transparent; color: var(--muted-foreground); padding: 6px 6px; }
  .btn.dis { opacity: .45; }
  .phone .btn { padding: 9px 14px; font-size: 13px; }
  .chip { border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-size: 11.5px; background: var(--card); line-height: 1.3; }
  .chip.on { border-color: var(--primary); background: var(--accent); }
  .chip .h { color: var(--muted-foreground); font-size: 10px; display: block; margin-top: 1px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .box { border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  .box.dv > div + div { border-top: 1px solid var(--border); }
  .li { display: flex; align-items: center; gap: 7px; padding: 7px 9px; font-size: 12px; }
  .li .n { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--working); }
  .dot.w { background: var(--waiting); } .dot.i { background: var(--idle); }
  .sw { width: 32px; height: 19px; border-radius: 999px; background: var(--input); position: relative; flex-shrink: 0; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .sw.on { background: var(--primary); } .sw.on::after { left: 15px; }
  .sw.dis { opacity: .4; }
  .phone .sw { width: 40px; height: 24px; } .phone .sw::after { width: 20px; height: 20px; } .phone .sw.on::after { left: 18px; }
  .cb { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--input); background: var(--card); flex-shrink: 0; display: inline-grid; place-items: center; font-size: 10px; color: #fff; margin-top: 1px; }
  .cb.on { background: var(--primary); border-color: var(--primary); } .cb.on::after { content: '✓'; font-weight: 700; }
  .ck { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; line-height: 1.4; }
  .sel { border: 1px solid var(--input); border-radius: 7px; background: var(--card); padding: 6px 9px; font-size: 12px; display: flex; justify-content: space-between; }
  .sel::after { content: '▾'; color: var(--muted-foreground); }
  .inp { border: 1px solid var(--input); border-radius: 7px; background: var(--card); padding: 6px 9px; font-size: 12px; }
  .lbl { font-size: 11px; color: var(--muted-foreground); margin-bottom: 3px; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }
  .stat { background: var(--muted); border-radius: 9px; padding: 9px 10px; } .stat .v { font-size: 17px; font-weight: 700; }
  .lv { height: 7px; border-radius: 4px; background: var(--muted); overflow: hidden; } .lv i { display: block; height: 100%; width: 62%; background: var(--primary); border-radius: 4px; }
  .rc { border-radius: 999px; padding: 2px 9px; font-size: 11px; background: var(--muted); }
  .rc.p { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); font-weight: 600; }
  .lock { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted-foreground); background: var(--muted); border-radius: 999px; padding: 2px 7px; }
  .hl { outline: 2px dashed #FF7AC6; outline-offset: 2px; border-radius: 8px; }

  /* 카드형 */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
  .card .top { display: flex; align-items: center; gap: 9px; }
  .card .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
  .card .tt { flex: 1; min-width: 0; } .card .tt b { font-size: 13px; display: block; } .card .tt span { font-size: 11px; color: var(--muted-foreground); }
  .seg { display: flex; background: var(--muted); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg span { flex: 1; text-align: center; padding: 6px 4px; font-size: 11.5px; border-radius: 7px; color: var(--muted-foreground); white-space: nowrap; }
  .seg span.on { background: var(--card); color: var(--foreground); font-weight: 700; box-shadow: 0 1px 3px rgba(40,30,90,.18); }
  .seg span.on.r { color: var(--error); } .seg span.on.g { color: var(--working); }
  .phone .seg span { padding: 9px 4px; font-size: 12.5px; }
  .svc { display: flex; flex-wrap: wrap; gap: 6px; }
  .svc span { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 7px; font-size: 11.5px; background: var(--card); }
  .svc span.on { border-color: var(--primary); background: var(--accent); font-weight: 600; }
  .svc span.add { border-style: dashed; color: var(--primary); font-weight: 600; }
  .phone .svc span { padding: 7px 12px 7px 9px; font-size: 12.5px; }
  .kv { display: grid; grid-template-columns: 76px 1fr; gap: 7px 8px; align-items: center; font-size: 12px; }
  .kv .k { color: var(--muted-foreground); font-size: 11.5px; }
  .warn { color: var(--waiting); font-weight: 600; }

  /* 단계형 */
  .steps { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground); }
  .steps i { font-style: normal; width: 19px; height: 19px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--muted); font-weight: 700; font-size: 10.5px; }
  .steps .on { color: var(--foreground); font-weight: 700; } .steps .on i { background: var(--primary); color: #fff; }
  .steps .dn i { background: var(--working); color: #fff; }
  .steps em { flex: 1; height: 1px; background: var(--border); }
  .q { font-size: 16px; font-weight: 700; line-height: 1.35; }
  .opt { border: 1.5px solid var(--border); border-radius: 14px; padding: 11px 12px; background: var(--card); display: flex; gap: 10px; }
  .opt.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 6%, var(--card)); }
  .opt .rd { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--input); flex-shrink: 0; margin-top: 2px; }
  .opt.on .rd { border: 5px solid var(--primary); }
  .opt b { font-size: 13.5px; } .opt ul { margin: 4px 0 0 15px; font-size: 11.5px; color: var(--muted-foreground); line-height: 1.5; }
  .opt .rec { font-size: 10px; font-weight: 700; color: var(--primary); background: var(--accent); border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: 1px; }
  .sum { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 13px; line-height: 1.7; }
  .sum u { text-decoration: none; border-bottom: 1.5px dashed var(--primary); color: var(--primary); font-weight: 600; }
  .qr { display: flex; align-items: center; gap: 10px; padding: 11px 12px; }
  .qr .ic { font-size: 16px; width: 22px; text-align: center; }
  .qr .t { flex: 1; } .qr .t b { display: block; font-size: 12.5px; } .qr .t span { font-size: 11.5px; color: var(--muted-foreground); }
  .qr .ch { color: var(--muted-foreground); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px -10px rgba(0,0,0,.35); padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--input); align-self: center; }
  .dim { position: absolute; inset: 0; background: rgba(20,16,40,.35); }

  /* 접이식 */
  .adv { border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  .adv > .hd { display: flex; align-items: center; gap: 8px; padding: 11px 12px; font-size: 12.5px; font-weight: 700; }
  .adv > .hd .c { color: var(--muted-foreground); font-weight: 500; font-size: 11px; flex: 1; }
  .adv > .bd { border-top: 1px solid var(--border); padding: 11px 12px; display: flex; flex-direction: column; gap: 12px; }
  .adv .grp { display: flex; flex-direction: column; gap: 6px; }
  .adv .grp > .gt { font-size: 11px; font-weight: 700; color: var(--muted-foreground); }
  .sr { display: flex; align-items: center; gap: 10px; padding: 9px 11px; font-size: 12.5px; }
  .sr .t { flex: 1; min-width: 0; } .sr .t span { display: block; font-size: 11px; color: var(--muted-foreground); }
  .phone .sr { padding: 12px 12px; }

  /* 문구표 */
  table.tm { border-collapse: collapse; width: 1540px; background: var(--card); border-radius: 12px; overflow: hidden; font-size: 12.5px; }
  table.tm th { text-align: left; background: var(--accent); padding: 8px 10px; font-size: 12px; }
  table.tm td { border-top: 1px solid var(--border); padding: 7px 10px; vertical-align: top; line-height: 1.45; }
  table.tm td.b { color: var(--muted-foreground); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--error) 55%, transparent); width: 430px; }
  table.tm td.a { font-weight: 600; width: 400px; }
  table.tm td.w { color: var(--muted-foreground); width: 330px; }
  table.tm tr.grp td { background: var(--muted); font-weight: 700; }
  .pr { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .pr.상 { background: #FDE2E2; color: var(--error); } .pr.중 { background: #FFF1D6; color: var(--waiting); } .pr.하 { background: var(--muted); color: var(--muted-foreground); }
</style>
</head>
<body>
<nav class="tabs-top" id="nav"></nav>
<div id="root"></div>
<script src="terms.js"></script>
<script>
const qs = new URLSearchParams(location.search)
const SHEET = qs.get('sheet') || 'terms'
if (qs.get('capture')) document.body.classList.add('capture')
const SHEETS = [['terms', '쉬운 말 비교표'], ['now', '지금 화면'], ['a', '1안 카드형'], ['b', '2안 단계형'], ['c', '3안 접이식 고급 설정']]
document.getElementById('nav').innerHTML = SHEETS.map(([k, n]) => `<a href="?sheet=${k}" class="${k === SHEET ? 'on' : ''}">${n}</a>`).join('')

// ── 틀 ──
const head = (tab) => `
  <div class="ph"><div class="av">🎨</div><div><div class="nm">이디자</div><div class="rl">디자이너 · 디자인 팀</div></div><div class="sp"></div><span class="pill idle">쉬는 중</span></div>
  <div class="ptabs">${['업무', '변경', '장비', '프로필'].map((x) => `<span class="${x === tab ? 'on' : ''}">${x}</span>`).join('')}</div>`
const desk = (tab, inner, foot = '', overlay = '') => `
  <div class="win"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><span style="margin-left:8px">AI Office</span></div>
  <div class="body"><div class="office"></div><div class="panel">${head(tab)}<div class="content"><div class="scroll">${inner}</div><div class="more">↓ 아래로 더 있어요</div></div>${foot}${overlay}</div></div></div>`
const phone = (tab, inner, foot = '', overlay = '') => `
  <div class="phone"><div class="sys"><span>9:41</span><span class="cam"></span><span>▮▮ 82%</span></div>
  <div class="panel">${head(tab)}<div class="content"><div class="scroll">${inner}</div><div class="more">↓ 아래로 더 있어요</div></div>${foot}${overlay}</div>
  <div class="btabs">${[['🏢', '사무실'], ['💬', '대화'], ['👥', '직원'], ['✅', '결재함'], ['☰', '더보기']].map(([i, n]) => `<span class="${n === '직원' ? 'on' : ''}"><b>${i}</b>${n}</span>`).join('')}</div><div class="gest"><i></i></div></div>`
const sw = (on, dis) => `<span class="sw ctl ${on ? 'on' : ''} ${dis ? 'dis' : ''}"></span>`
const cb = (on) => `<span class="cb ctl ${on ? 'on' : ''}"></span>`
const seg = (opts, on) => `<div class="seg ctl">${opts.map((o, i) => `<span class="${i === on ? 'on' : ''} ${i === on && /막기/.test(o) ? 'r' : ''} ${i === on && /결재 없이/.test(o) ? 'g' : ''}">${o}</span>`).join('')}</div>`
const pcOnly = (m) => (m ? `<span class="lock">🔒 PC에서 바꿀 수 있어요</span>` : '')

// ══════════ 지금 화면 (1.2.0 코드 기준으로 다시 그림) ══════════
const nowEquip = (m) => `
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:6px"><span class="h3">🔌 연결 도구</span><span class="mut xs" style="flex:1">켠 연결 도구 3개</span>${m ? '' : '<span class="btn gh ctl">⟳</span><span class="btn o ctl">＋ 연결 도구 추가</span>'}</div>
    <div class="box mut xs" style="padding:8px;display:flex;flex-direction:column;gap:5px;line-height:1.45">
      <span>📡 직원 브라우저는 내 크롬과 따로 써요. 직원이 내 로그인·비밀번호를 마음대로 쓰지 못하게 하려는 보안 때문이에요.</span><span>한 번 로그인하면 다음에도 로그인이 유지돼요.</span>
      ${m ? '' : `<span style="display:flex;gap:7px;align-items:center;color:var(--foreground);font-weight:600">${sw(false)}모든 직원이 같은 로그인 쓰기</span><span>켜면 한 직원이 로그인한 사이트를 다른 직원도 이어 써요. 한 번에 한 직원만 브라우저를 쓸 수 있고, 기존 직원별 로그인은 그대로 남아요.</span>`}
    </div>
    <div class="box dv">
      <div class="li"><span class="mut">›</span><span class="dot"></span><span class="n">🌐 브라우저</span>${sw(true)}</div>

  <div class="adv"><div class="hd">▾ 고급 설정<span class="c">개발에 익숙하면 · 9개</span></div><div class="bd">
    <div class="grp"><span class="gt">일마다 따로 정하기</span>
      <div class="kv" style="grid-template-columns:96px 1fr"><span class="k">파일 고치기</span>${seg(['결재 받기', '결재 없이'], 1)}<span class="k">인터넷 검색</span>${seg(['막기', '받기', '없이'], 2)}<span class="k">프로그램 실행</span>${seg(['막기', '받기', '없이'], 1)}<span class="k">화면 찍기</span>${seg(['결재 받기', '결재 없이'], 0)}</div>
      <span class="ck">${cb(true)}보기만 하는 실행은 결재 없이</span><span class="ck">${cb(true)}위험한 것은 항상 막기</span></div>

      <span class="ck">${cb(false)}<span>🖱️ 컴퓨터 조작 (맥만)</span></span>

    <div class="grp"><span class="gt">사용량</span><span class="ck">${cb(true)}쉬운 일(분류·요약)은 가벼운 AI로 해서 사용량 아끼기</span></div>
    <span class="mut xs">› 개발자용 자세히 (도구 이름·명령 목록·서비스 어디서 왔나)</span>

// ══════════ 시트 ══════════
const col = (title, tag, frame, notes = '') => `<div class="col"><h2>${tag ? `<span class="tag ${tag === '지금' ? 'g' : ''}">${tag}</span>` : ''}${title}</h2><div class="metric" data-metric></div>${frame}${notes}</div>`
const sheets = {
  now: () => `<h1 class="st">지금 화면 — 장비·프로필 (1.2.0)</h1>
    <p class="ss">1.2.0 코드(EquipmentTab·McpSection·StaffPanel 프로필)의 구성과 문구를 그대로 다시 그린 그림입니다. 실제 앱을 찍은 사진이 아닙니다. 데스크톱 패널은 기본 폭 380px, 휴대폰은 390px입니다.<br>
    휴대폰에서는 PC에서만 바꿀 수 있는 항목(도구 권한·작업 폴더 등)이 회색 또는 🔒로 바뀝니다.</p>
    <div class="row">${col('데스크톱 · 장비', '지금', desk('장비', nowEquip(false)))}${col('데스크톱 · 프로필', '지금', desk('프로필', nowProfile(false)))}${col('휴대폰 · 장비', '지금', phone('장비', nowEquip(true)))}${col('휴대폰 · 프로필', '지금', phone('프로필', nowProfile(true)))}</div>`,
  a: () => `<h1 class="st">1안 카드형 — 일마다 카드 한 장</h1>
    <p class="ss">'파일 만들기·고치기', '인터넷 검색'처럼 <b>할 일 하나에 카드 한 장</b>을 두고, 카드 안에서 <b>[막기 · 결재 받기 · 결재 없이]</b> 중 하나를 고릅니다. 지금은 '웹 금지'와 '웹 자율'이 따로 있어서 하나를 켜면 다른 하나가 몰래 꺼지는데, 이 문제가 없어집니다(분홍 점선).<br>
    바꾸면 아래에 '바꾼 것 N개 · 이대로 지급' 줄이 떠 있어서, 저장 버튼을 찾아 맨 아래까지 내려가지 않아도 됩니다. 프로필도 같은 카드 모양으로 나눕니다.</p>
    <div class="row">${col('데스크톱 · 장비', '1안', desk('장비', aEquip(false), aSave(false)))}${col('데스크톱 · 프로필', '1안', desk('프로필', aProfile(false)))}${col('휴대폰 · 장비', '1안', phone('장비', aEquip(true), aSave(true)))}${col('휴대폰 · 프로필', '1안', phone('프로필', aProfile(true)))}</div>`,
  b: () => `<h1 class="st">2안 단계형 — 질문에 답하며 고르기</h1>
    <p class="ss">장비는 <b>① 얼마나 맡길까요 → ② 줄 도구 → ③ 확인</b> 3단계로 고릅니다. ①에서 3가지 수준 중 하나만 고르면 세부 권한이 한꺼번에 정해집니다. ③에서 고른 내용을 한 문장으로 읽어 줍니다.<br>
    프로필은 맨 위에 직원을 한 문장으로 소개하고, 밑줄이나 질문 줄을 누르면 바꾸는 창이 열립니다. 'AI 바꾸기'처럼 결과가 큰 것은 그 창 안에서도 단계를 나눕니다.</p>
    <div class="row">${col('데스크톱 · 장비 ①', '2안', desk('장비', bEquip1(false), bNav('', '다음 →')))}${col('데스크톱 · 장비 ③ 확인', '2안', desk('장비', bEquip3(false), bNav('이전', '이대로 지급'))) }${col('데스크톱 · 프로필', '2안', desk('프로필', bProfile(false)))}</div>
    <div class="row" style="margin-top:28px">${col('휴대폰 · 장비 ②', '2안', phone('장비', bEquip2(true), bNav('이전', '다음 →')))}${col('휴대폰 · 프로필', '2안', phone('프로필', bProfile(true)))}${col('휴대폰 · 프로필 › AI 바꾸기', '2안', phone('프로필', bProfile(true), '', bAiSheet))}</div>`,
  c: () => `<h1 class="st">3안 접이식 고급 설정 — 자주 쓰는 것만 먼저</h1>
    <p class="ss">처음엔 <b>맡기는 정도(3칸)와 쓰는 도구 켜기·끄기</b>만 보입니다. 일마다 따로 정하기, 컴퓨터 조작, 공용 로그인, 사용량 아끼기, 개발자용 자세히는 <b>고급 설정</b> 안에 접어 둡니다. 지금 화면과 기능은 같고 보이는 순서만 바뀝니다.<br>
    프로필도 이름·실적·결재 방식·팀만 먼저 보이고, AI·작업 폴더·참고 문서·예약 업무는 고급 설정에 넣습니다.</p>
    <div class="row">${col('데스크톱 · 장비 (고급 펼침)', '3안', desk('장비', cBasic(false) + cAdvOpen(false), aSave(false)))}${col('데스크톱 · 프로필', '3안', desk('프로필', cProfileBasic(false)))}${col('휴대폰 · 장비 (고급 접힘)', '3안', phone('장비', cBasic(true) + cAdvClosed, aSave(true)))}${col('휴대폰 · 프로필', '3안', phone('프로필', cProfileBasic(true)))}</div>`,
  terms: () => {
    const T = window.TERMS
    let g = ''
    const rows = T.map((r) => {
      const gh = r.g !== g ? `<tr class="grp"><td colspan="5">${r.g === '함께' ? '장비·프로필 함께 (구성 문제)' : r.g + ' 탭'}</td></tr>` : ''

      return `${gh}<tr><td style="width:180px">${r.where}</td><td class="b">${r.before}</td><td class="a">${r.after}</td><td class="w">${r.why}</td><td><span class="pr ${r.p}">${r.p}</span></td></tr>`
    }).join('')
    const cnt = (p) => T.filter((r) => r.p === p).length
    return `<h1 class="st">장비·프로필 — 어려운 말 → 쉬운 말 비교표</h1>
      <p class="ss">1.2.0 사전(한국어)과 화면 코드에서 장비·프로필 탭의 문구를 모두 읽고, 비개발자에게 어려운 것만 골랐습니다. 총 <b>${T.length}개</b>(우선순위 상 ${cnt('상')} · 중 ${cnt('중')} · 하 ${cnt('하')}).<br>
      원칙: ① '자율'·'금지' → 앱 기본 말인 <b>'결재 없이'·'막기'</b>로 통일 ② 영어 도구 이름·파일 이름(Bash·.mcp.json·WebFetch)은 <b>'개발자용 자세히'로 접기</b>(지우지 않음) ③ '연결 도구' → <b>'연결된 서비스'</b> ④ '엔진·모델' → <b>'일하는 AI·AI 등급'</b> ⑤ 원리 설명보다 결과(느려져요·사용량이 차요)를 먼저.<br>
      영어·일본어·중국어는 개발 단계에서 같은 뜻으로 맞춥니다. 시안 3안 모두 이 문구를 씁니다.</p>
      <table class="tm"><thead><tr><th>어디</th><th>지금 문구</th><th>바꾼 문구</th><th>무엇이 어려운가</th><th>우선</th></tr></thead><tbody>${rows}</tbody></table>`
  },
}
document.getElementById('root').innerHTML = sheets[SHEET]()

// 비교 지표: 탭 전체 길이(화면 몇 장)와 조작 요소 수
document.querySelectorAll('.col').forEach((c) => {
  const sc = c.querySelector('.scroll'), ct = c.querySelector('.content'), mt = c.querySelector('[data-metric]')
  if (!sc || !mt) return
  const screens = sc.scrollHeight / ct.clientHeight
  const ctl = c.querySelectorAll('.ctl').length
  const hasMore = sc.scrollHeight > ct.clientHeight + 4
  c.querySelector('.more').style.display = hasMore ? '' : 'none'
  mt.innerHTML = `전체 길이 <b>${Math.round(sc.scrollHeight)}px</b> (화면 ${screens.toFixed(1)}장) · 누를 곳 <b>${ctl}개</b>`
})
</script>
</body>
</html>
