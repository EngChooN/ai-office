<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>직원 패널 장비·프로필 — 쉬운 말 + 단순화 시안</title>
<!-- 디자인 시안 전용(앱 코드 아님). ?sheet=terms|now|a|b|c 로 열어 캡처한다 -->
<style>
  :root {
    --background:#F6F5FB; --foreground:#221F33; --card:#FFFFFF; --primary:#6C5CE7; --primary-foreground:#FFFFFF;
    --muted:#ECEAF6; --muted-foreground:#66627F; --accent:#E9E6FA; --border:#DEDAF0; --input:#CFCAE6;
    --chrome:#FBFAFF; --working:#1C7C46; --waiting:#9A5B00; --idle:#8A8A80; --error:#C42B2B;
    --sheet-bg:#E4E1F2; --side1:#7B6CF0; --side2:#B58CF5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--sheet-bg); }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--foreground); padding: 32px 36px 40px; width: max-content; font-size: 13px; }
  .tabs-top { display: flex; gap: 6px; margin-bottom: 18px; }
  .tabs-top a { padding: 7px 14px; border-radius: 999px; background: var(--card); color: var(--foreground); text-decoration: none; font-weight: 600; border: 1px solid var(--border); }
  .tabs-top a.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .capture .tabs-top { display: none; }
  h1.st { font-size: 25px; font-weight: 700; }
  p.ss { color: var(--muted-foreground); font-size: 14px; margin: 6px 0 20px; max-width: 1500px; line-height: 1.5; }
  .row { display: flex; gap: 28px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 9px; }
  .col h2 { font-size: 15px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--primary); color: #fff; }
  .tag.g { background: var(--muted-foreground); }
  .metric { font-size: 12px; color: var(--muted-foreground); }
  .metric b { color: var(--foreground); font-size: 14px; }
  .notes { width: 100%; font-size: 12.5px; line-height: 1.55; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; }
  .notes li { margin-left: 16px; }

  /* ── 데스크톱 창 ── */
  .win { width: 560px; height: 880px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--background); border: 1px solid #c9c4e0; box-shadow: 0 18px 36px -18px rgba(40,30,90,.45); }
  .win .bar { height: 30px; flex-shrink: 0; background: var(--chrome); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 11px; color: var(--muted-foreground); }
  .win .bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .win .body { flex: 1; display: flex; min-height: 0; }

  .win .panel { width: 380px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--background); display: flex; flex-direction: column; min-height: 0; position: relative; }

  /* ── 휴대폰 ── */
  .phone { width: 390px; height: 844px; border-radius: 30px; overflow: hidden; position: relative; background: var(--background); border: 6px solid #0d0c12; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); display: flex; flex-direction: column; }
  .sys { height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 600; background: var(--chrome); }
  .sys .cam { width: 9px; height: 9px; border-radius: 50%; background: #000; }
  .phone .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .btabs { height: 52px; flex-shrink: 0; display: flex; border-top: 1px solid var(--border); background: var(--chrome); font-size: 10.5px; color: var(--muted-foreground); }
  .btabs span { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .btabs span b { font-size: 16px; font-weight: 400; }
  .btabs span.on { color: var(--primary); font-weight: 700; }
  .gest { height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--chrome); }
  .gest i { width: 96px; height: 4px; border-radius: 2px; background: var(--muted-foreground); opacity: .5; }

  /* ── 패널 머리 ── */
  .ph { height: 54px; flex-shrink: 0; display: flex; align-items: center; gap: 9px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--chrome); }
  .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FFD6A5, #FDA4AF); display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
  .ph .nm { font-weight: 700; font-size: 14px; } .ph .rl { color: var(--muted-foreground); font-size: 11.5px; }
  .ph .sp { flex: 1; }
  .pill { border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600; background: var(--accent); white-space: nowrap; }
  .pill.idle::before { content: '● '; color: var(--idle); }
  .ptabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; font-size: 13px; background: var(--chrome); }
  .ptabs span { padding: 9px 12px; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .ptabs span.on { color: var(--foreground); font-weight: 600; border-color: var(--primary); }
  .content { flex: 1; overflow: hidden; position: relative; }
  .scroll { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .phone .scroll { padding: 14px 14px 24px; }
  .more { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--background) 72%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 11px; font-weight: 600; color: var(--muted-foreground); pointer-events: none; }
  .savebar { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--card); padding: 9px 14px; display: flex; align-items: center; gap: 10px; }
  .savebar .t { flex: 1; font-size: 11.5px; color: var(--muted-foreground); line-height: 1.35; }
  .savebar .t b { color: var(--foreground); }

  /* ── 부품 ── */
  .h3 { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .mut { color: var(--muted-foreground); }
  .xs { font-size: 11px; } .xxs { font-size: 10px; }
  .lead { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.5; }
  .btn { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; background: var(--primary); color: #fff; white-space: nowrap; }
  .btn.o { background: var(--card); color: var(--foreground); border: 1px solid var(--border); }
  .btn.gh { background: transparent; color: var(--muted-foreground); padding: 6px 6px; }
  .btn.dis { opacity: .45; }
  .phone .btn { padding: 9px 14px; font-size: 13px; }
  .chip { border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-size: 11.5px; background: var(--card); line-height: 1.3; }
  .chip.on { border-color: var(--primary); background: var(--accent); }
  .chip .h { color: var(--muted-foreground); font-size: 10px; display: block; margin-top: 1px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

    <span class="k">작업 폴더</span><span><b>claude-office</b> ${m ? '<span class="lock">🔒 PC</span>' : '<u class="xs">바꾸기</u>'}</span><span class="k">먼저 읽을 문서</span><span>2개 <span class="mut">›</span></span><span class="k">예약 업무</span><span>없음 · <u class="xs">관리</u></span></div>
    <span class="mut xs">Lv.7 · 경험치 1,240 ⓘ · 한 작업 수 1,284 · 결재 받은 횟수 96 · 입사 2026. 10. 2.</span>
  </div></div>`

// ══════════ 시트 ══════════
const col = (title, tag, frame, notes = '') => `<div class="col"><h2>${tag ? `<span class="tag ${tag === '지금' ? 'g' : ''}">${tag}</span>` : ''}${title}</h2><div class="metric" data-metric></div>${frame}${notes}</div>`
const sheets = {
  now: () => `<h1 class="st">지금 화면 — 장비·프로필 (1.2.0)</h1>
    <p class="ss">1.2.0 코드(EquipmentTab·McpSection·StaffPanel 프로필)의 구성과 문구를 그대로 다시 그린 그림입니다. 실제 앱을 찍은 사진이 아닙니다. 데스크톱 패널은 기본 폭 380px, 휴대폰은 390px입니다.<br>
    휴대폰에서는 PC에서만 바꿀 수 있는 항목(도구 권한·작업 폴더 등)이 회색 또는 🔒로 바뀝니다.</p>
    <div class="row">${col('데스크톱 · 장비', '지금', desk('장비', nowEquip(false)))}${col('데스크톱 · 프로필', '지금', desk('프로필', nowProfile(false)))}${col('휴대폰 · 장비', '지금', phone('장비', nowEquip(true)))}${col('휴대폰 · 프로필', '지금', phone('프로필', nowProfile(true)))}</div>`,
  a: () => `<h1 class="st">1안 카드형 — 일마다 카드 한 장</h1>
    <p class="ss">'파일 만들기·고치기', '인터넷 검색'처럼 <b>할 일 하나에 카드 한 장</b>을 두고, 카드 안에서 <b>[막기 · 결재 받기 · 결재 없이]</b> 중 하나를 고릅니다. 지금은 '웹 금지'와 '웹 자율'이 따로 있어서 하나를 켜면 다른 하나가 몰래 꺼지는데, 이 문제가 없어집니다(분홍 점선).<br>
    바꾸면 아래에 '바꾼 것 N개 · 이대로 지급' 줄이 떠 있어서, 저장 버튼을 찾아 맨 아래까지 내려가지 않아도 됩니다. 프로필도 같은 카드 모양으로 나눕니다.</p>
    <div class="row">${col('데스크톱 · 장비', '1안', desk('장비', aEquip(false), aSave(false)))}${col('데스크톱 · 프로필', '1안', desk('프로필', aProfile(false)))}${col('휴대폰 · 장비', '1안', phone('장비', aEquip(true), aSave(true)))}${col('휴대폰 · 프로필', '1안', phone('프로필', aProfile(true)))}</div>`,
  b: () => `<h1 class="st">2안 단계형 — 질문에 답하며 고르기</h1>
    <p class="ss">장비는 <b>① 얼마나 맡길까요 → ② 줄 도구 → ③ 확인</b> 3단계로 고릅니다. ①에서 3가지 수준 중 하나만 고르면 세부 권한이 한꺼번에 정해집니다. ③에서 고른 내용을 한 문장으로 읽어 줍니다.<br>
    프로필은 맨 위에 직원을 한 문장으로 소개하고, 밑줄이나 질문 줄을 누르면 바꾸는 창이 열립니다. 'AI 바꾸기'처럼 결과가 큰 것은 그 창 안에서도 단계를 나눕니다.</p>
    <div class="row">${col('데스크톱 · 장비 ①', '2안', desk('장비', bEquip1(false), bNav('', '다음 →')))}${col('데스크톱 · 장비 ③ 확인', '2안', desk('장비', bEquip3(false), bNav('이전', '이대로 지급'))) }${col('데스크톱 · 프로필', '2안', desk('프로필', bProfile(false)))}</div>
    <div class="row" style="margin-top:28px">${col('휴대폰 · 장비 ②', '2안', phone('장비', bEquip2(true), bNav('이전', '다음 →')))}${col('휴대폰 · 프로필', '2안', phone('프로필', bProfile(true)))}${col('휴대폰 · 프로필 › AI 바꾸기', '2안', phone('프로필', bProfile(true), '', bAiSheet))}</div>`,
  c: () => `<h1 class="st">3안 접이식 고급 설정 — 자주 쓰는 것만 먼저</h1>
    <p class="ss">처음엔 <b>맡기는 정도(3칸)와 쓰는 도구 켜기·끄기</b>만 보입니다. 일마다 따로 정하기, 컴퓨터 조작, 공용 로그인, 사용량 아끼기, 개발자용 자세히는 <b>고급 설정</b> 안에 접어 둡니다. 지금 화면과 기능은 같고 보이는 순서만 바뀝니다.<br>
    프로필도 이름·실적·결재 방식·팀만 먼저 보이고, AI·작업 폴더·참고 문서·예약 업무는 고급 설정에 넣습니다.</p>
    <div class="row">${col('데스크톱 · 장비 (고급 펼침)', '3안', desk('장비', cBasic(false) + cAdvOpen(false), aSave(false)))}${col('데스크톱 · 프로필', '3안', desk('프로필', cProfileBasic(false)))}${col('휴대폰 · 장비 (고급 접힘)', '3안', phone('장비', cBasic(true) + cAdvClosed, aSave(true)))}${col('휴대폰 · 프로필', '3안', phone('프로필', cProfileBasic(true)))}</div>`,
  terms: () => {
    const T = window.TERMS
    let g = ''
    const rows = T.map((r) => {
      const gh = r.g !== g ? `<tr class="grp"><td colspan="5">${r.g === '함께' ? '장비·프로필 함께 (구성 문제)' : r.g + ' 탭'}</td></tr>` : ''
      g = r.g
      return `${gh}<tr><td style="width:180px">${r.where}</td><td class="b">${r.before}</td><td class="a">${r.after}</td><td class="w">${r.why}</td><td><span class="pr ${r.p}">${r.p}</span></td></tr>`
    }).join('')
    const cnt = (p) => T.filter((r) => r.p === p).length
    return `<h1 class="st">장비·프로필 — 어려운 말 → 쉬운 말 비교표</h1>
      <p class="ss">1.2.0 사전(한국어)과 화면 코드에서 장비·프로필 탭의 문구를 모두 읽고, 비개발자에게 어려운 것만 골랐습니다. 총 <b>${T.length}개</b>(우선순위 상 ${cnt('상')} · 중 ${cnt('중')} · 하 ${cnt('하')}).<br>
      원칙: ① '자율'·'금지' → 앱 기본 말인 <b>'결재 없이'·'막기'</b>로 통일 ② 영어 도구 이름·파일 이름(Bash·.mcp.json·WebFetch)은 <b>'개발자용 자세히'로 접기</b>(지우지 않음) ③ '연결 도구' → <b>'연결된 서비스'</b> ④ '엔진·모델' → <b>'일하는 AI·AI 등급'</b> ⑤ 원리 설명보다 결과(느려져요·사용량이 차요)를 먼저.<br>
      영어·일본어·중국어는 개발 단계에서 같은 뜻으로 맞춥니다. 시안 3안 모두 이 문구를 씁니다.</p>
      <table class="tm"><thead><tr><th>어디</th><th>지금 문구</th><th>바꾼 문구</th><th>무엇이 어려운가</th><th>우선</th></tr></thead><tbody>${rows}</tbody></table>`
  },
}
document.getElementById('root').innerHTML = sheets[SHEET]()

// 비교 지표: 탭 전체 길이(화면 몇 장)와 조작 요소 수
document.querySelectorAll('.col').forEach((c) => {
  const sc = c.querySelector('.scroll'), ct = c.querySelector('.content'), mt = c.querySelector('[data-metric]')
  if (!sc || !mt) return
  const screens = sc.scrollHeight / ct.clientHeight
  const ctl = c.querySelectorAll('.ctl').length
  const hasMore = sc.scrollHeight > ct.clientHeight + 4
  c.querySelector('.more').style.display = hasMore ? '' : 'none'
  mt.innerHTML = `전체 길이 <b>${Math.round(sc.scrollHeight)}px</b> (화면 ${screens.toFixed(1)}장) · 누를 곳 <b>${ctl}개</b>`
})}
render()
</script>
</body>
</html>
