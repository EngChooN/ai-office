<meta charset=utf-8><link rel=stylesheet href=tokens.css><style>body{margin:0;padding:20px;width:760px;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:#888;display:flex;gap:16px}.p{flex:1;padding:14px;border-radius:18px;background:var(--background);color:var(--foreground)}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.k{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-hud);background:var(--card);font-size:13px;font-weight:600}.k.on{border-color:var(--ring);box-shadow:var(--focus-ring)}.theme-swatch{width:34px;height:34px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}small{display:block;font-weight:400;color:var(--muted-foreground);font-size:11px}</style>
<div class=p data-theme=lavender data-mode=light><b>색 테마 · 라이트</b><div class=g id=a></div></div>
<div class=p data-theme=lavender data-mode=dark><b>색 테마 · 다크</b><div class=g id=b></div></div>
<script>fetch('themes.json').then(r=>r.json()).then(j=>{for(const id of['a','b'])document.getElementById(id).innerHTML=j.themes.map((t,i)=>`<div class="k ${i==0?'on':''}"><span class=theme-swatch data-swatch=${t.id}></span><span>${t.name.ko}<small>${t.name.en}</small></span></div>`).join('')})</script>
