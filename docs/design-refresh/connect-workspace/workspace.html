<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>워크스페이스 — 내 PC 여러 대를 오가며 쓰기 · 시안 3안</title>
<!-- 디자인 시안 전용(앱 코드 아님). ?sheet=sum|a|b|c|add|manage|ask &mode=light|dark &cap=1 로 열어 캡처한다. QR·사무실 그림은 모양만 흉내 낸 가짜다 -->
<style>
  [data-mode='light'] {
    --background:#F6F5FB; --foreground:#221F33; --card:#FFFFFF; --primary:#6C5CE7; --on-primary:#FFFFFF;
    --muted:#ECEAF6; --muted-foreground:#66627F; --accent:#E9E6FA; --border:#DEDAF0; --input:#CFCAE6;
    --chrome:#FBFAFF; --working:#1C7C46; --waiting:#9A5B00; --idle:#8A8A80; --error:#C42B2B;
    --sheet-bg:#E4E1F2; --side1:#7B6CF0; --side2:#B58CF5; --tile-on:#F4F2FF; --dim:rgba(30,25,60,.38);
    --floor:#EFE6D6; --floor2:#E6DAC5; --desk:#C9A27A; --wall:#D9CFF0; --frame:#c9c4e0;
  }
  [data-mode='dark'] {
    --background:#14131C; --foreground:#EDEBF8; --card:#201F2D; --primary:#9B8CFF; --on-primary:#1A1240;
    --muted:#292739; --muted-foreground:#A7A3C4; --accent:#302D47; --border:#34314A; --input:#413E5C;
    --chrome:#181723; --working:#4ADE80; --waiting:#F2C94C; --idle:#9C9AA8; --error:#FF6B6B;
    --sheet-bg:#0C0B12; --side1:#4B3FB0; --side2:#7A55B8; --tile-on:#2A2650; --dim:rgba(0,0,0,.55);
    --floor:#2B2A35; --floor2:#25242E; --desk:#5A4A3A; --wall:#2F2B45; --frame:#2a2838;
  }
  /* 워크스페이스(PC)마다 고유색 — 기존 보라 계열 옆에 구분되는 3색 */
  [data-mode='light'] .ws-home { --ws:#6C5CE7; --ws-soft:#EEEBFD; --ws-on:#fff; }
  [data-mode='light'] .ws-work { --ws:#0E8C7E; --ws-soft:#E0F4F1; --ws-on:#fff; }
  [data-mode='light'] .ws-lab  { --ws:#C8571F; --ws-soft:#FBEADF; --ws-on:#fff; }
  [data-mode='light'] .ws-note { --ws:#2F6FD0; --ws-soft:#E3EDFB; --ws-on:#fff; }
  [data-mode='dark'] .ws-home { --ws:#9B8CFF; --ws-soft:#2A2650; --ws-on:#1A1240; }
  [data-mode='dark'] .ws-work { --ws:#3DD6C0; --ws-soft:#16302D; --ws-on:#0B2420; }
  [data-mode='dark'] .ws-lab  { --ws:#FF9A62; --ws-soft:#38251A; --ws-on:#2B1608; }
  [data-mode='dark'] .ws-note { --ws:#6FA8FF; --ws-soft:#1A2740; --ws-on:#0B1A33; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--sheet-bg); }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--foreground); padding: 32px 36px 40px; width: max-content; min-width: 100vw; font-size: 13px; }
  .tabs-top { display: flex; gap: 6px; margin-bottom: 18px; align-items: center; }
  .tabs-top a { padding: 7px 14px; border-radius: 999px; background: var(--card); color: var(--foreground); text-decoration: none; font-weight: 600; border: 1px solid var(--border); cursor: pointer; }
  .tabs-top a.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .tabs-top .mode { margin-left: 14px; }
  .capture .tabs-top { display: none; }
  .sheet { display: none; } .sheet.on { display: block; }
  h1.st { font-size: 25px; font-weight: 700; }
  p.ss { color: var(--muted-foreground); font-size: 14px; margin: 6px 0 20px; max-width: 1560px; line-height: 1.55; }
  .row { display: flex; gap: 26px; align-items: flex-start; }
  .row + .row { margin-top: 26px; }
  .col { display: flex; flex-direction: column; gap: 9px; }
  .col h2 { font-size: 15px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .col .cap { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; max-width: 760px; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--primary); color: var(--on-primary); }
  .tag.g { background: var(--muted-foreground); color: var(--card); }
  .notes { font-size: 12.8px; line-height: 1.65; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .notes li { margin-left: 18px; }
  .notes h3 { font-size: 14px; margin-bottom: 4px; }

  /* ── 공용 요소 ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--input); background: var(--card); color: var(--foreground); white-space: nowrap; }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
  .btn.lg { height: 40px; padding: 0 18px; font-size: 14px; border-radius: 10px; }
  .btn.pri { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .btn.wsb { background: var(--ws); color: var(--ws-on); border-color: var(--ws); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted-foreground); }
  .btn.red { border-color: color-mix(in srgb, var(--error) 55%, transparent); color: var(--error); }
  .btn.redf { background: var(--error); border-color: var(--error); color: #fff; }
  .btn.off { opacity: .45; }
  .link { color: var(--primary); font-weight: 600; font-size: 12px; }
  .small { font-size: 11.5px; color: var(--muted-foreground); line-height: 1.5; }
  .xs { font-size: 11px; color: var(--muted-foreground); }
  .mono { font-family: "SF Mono", Menlo, monospace; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--working); margin-right: 5px; vertical-align: 1px; flex-shrink: 0; }
  .dot.w { background: var(--waiting); } .dot.g { background: var(--idle); }
  .banner { border-radius: 10px; padding: 9px 11px; font-size: 12px; line-height: 1.5; display: flex; gap: 8px; align-items: flex-start; }
  .banner.warn { background: color-mix(in srgb, var(--waiting) 10%, transparent); border: 1px solid color-mix(in srgb, var(--waiting) 40%, transparent); }
  .banner.ok { background: color-mix(in srgb, var(--working) 10%, transparent); border: 1px solid color-mix(in srgb, var(--working) 40%, transparent); }
  .banner.info { background: var(--accent); border: 1px solid var(--border); }
  .banner.err { background: color-mix(in srgb, var(--error) 9%, transparent); border: 1px solid color-mix(in srgb, var(--error) 40%, transparent); }
  .chk { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; }
  .chk .ic { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: var(--working); margin-top: 1px; }
  .chk .ic.g { background: transparent; border: 1.5px solid var(--input); color: var(--muted-foreground); }
  .chk .ic.spin { background: transparent; border: 2px solid var(--accent); border-top-color: var(--primary); }
  .chk b { font-weight: 600; }
  .code { font-family: "SF Mono", Menlo, monospace; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .input { height: 32px; border: 1px solid var(--input); border-radius: 8px; padding: 0 10px; display: flex; align-items: center; font-size: 12.5px; background: var(--card); }
  .input.focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
  .qr { background: #fff; padding: 8px; border-radius: 10px; border: 1px solid var(--border); display: inline-block; line-height: 0; }
  .qr canvas { image-rendering: pixelated; }
  .tile { flex: 1; border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 5px; background: var(--card); }
  .tile .em { font-size: 26px; line-height: 1; }
  .tile b { font-size: 14px; }
  .tile.on { border-color: var(--primary); background: var(--tile-on); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .tile.h { flex-direction: row; gap: 12px; align-items: center; flex: 0 0 auto; }
  .prog { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted-foreground); }
  .prog i { width: 26px; height: 5px; border-radius: 3px; background: var(--muted); display: block; }
  .prog i.on { background: var(--primary); }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E5484D; color: #fff; font-size: 10.5px; font-weight: 800; display: inline-grid; place-items: center; }
  .badge.g { background: var(--muted); color: var(--muted-foreground); }
  .swatch { width: 22px; height: 22px; border-radius: 50%; background: var(--ws); display: inline-block; }
  .swatch.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ws); }

  /* 워크스페이스 표시 */
  .av { display: inline-grid; place-items: center; flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; background: var(--ws); color: var(--ws-on); font-weight: 800; font-size: 12px; position: relative; }
  .av.off { background: var(--muted); color: var(--muted-foreground); box-shadow: inset 0 0 0 1.5px var(--ws); }
  .av .st { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--card); background: var(--working); }
  .av .st.g { background: var(--idle); } .av .st.w { background: var(--waiting); }
  .wsname { font-weight: 700; color: var(--ws); }
  .me { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); }
  .ribbon { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 28px; flex-shrink: 0; background: var(--ws); color: var(--ws-on); font-size: 12px; font-weight: 600; }
  .ribbon .av { background: var(--ws-on); color: var(--ws); }
  .ribbon .btn { height: 20px; font-size: 11px; padding: 0 8px; background: transparent; color: var(--ws-on); border-color: color-mix(in srgb, var(--ws-on) 50%, transparent); margin-left: auto; }

  /* ── 데스크톱 창 ── */
  .win { border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--background); border: 1px solid var(--frame); box-shadow: 0 18px 36px -18px rgba(40,30,90,.45); position: relative; }
  .win.edge { box-shadow: 0 0 0 3px var(--ws), 0 18px 36px -18px rgba(40,30,90,.45); }
  .win .bar { height: 28px; flex-shrink: 0; background: var(--chrome); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 11px; color: var(--muted-foreground); }
  .win .bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .appbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--card); border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .appbar .sp { flex: 1; }
  .appbar .ib { height: 28px; padding: 0 9px; border-radius: 8px; background: var(--muted); display: inline-flex; gap: 5px; align-items: center; font-weight: 600; font-size: 12px; }
  .sw { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); font-weight: 700; font-size: 13px; }
  .sw.open { border-color: var(--ws); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ws) 22%, transparent); }
  .sw .car { color: var(--muted-foreground); font-size: 11px; }
  .win .body { flex: 1; display: flex; min-height: 0; position: relative; }
  .win .side { width: 52px; flex-shrink: 0; background: linear-gradient(180deg, var(--side1), var(--side2)); display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 14px; }
  .win .side i { width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,.35); display: block; }
  .win .side i.on { background: #fff; }
  .rail { width: 58px; flex-shrink: 0; background: var(--chrome); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 12px; position: relative; }
  .rail .ri { position: relative; display: grid; place-items: center; }
  .rail .ri .av { width: 38px; height: 38px; border-radius: 13px; font-size: 15px; }
  .rail .ri.cur::before { content: ""; position: absolute; left: -10px; width: 4px; height: 26px; border-radius: 0 3px 3px 0; background: var(--ws); }
  .rail .ri.cur .av { border-radius: 11px; box-shadow: 0 0 0 2px var(--chrome), 0 0 0 4px var(--ws); }
  .rail .ri .badge { position: absolute; right: -6px; top: -5px; border: 2px solid var(--chrome); height: 20px; }
  .rail .add { width: 38px; height: 38px; border-radius: 13px; border: 1.5px dashed var(--input); color: var(--muted-foreground); display: grid; place-items: center; font-size: 18px; }
  .rail .sep { width: 26px; height: 1px; background: var(--border); }
  .tip { position: absolute; left: 56px; background: var(--foreground); color: var(--background); font-size: 11.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; z-index: 5; line-height: 1.45; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); }
  .tip::before { content: ""; position: absolute; left: -5px; top: 10px; border: 5px solid transparent; border-left: 0; border-right-color: var(--foreground); }
  .win .content { flex: 1; min-width: 0; padding: 14px 16px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .dim { position: absolute; inset: 0; background: var(--dim); display: flex; align-items: center; justify-content: center; z-index: 6; }
  .modal { width: 460px; background: var(--card); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.5); border: 1px solid var(--border); }
  .modal .mh { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .modal .md { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; margin-top: -5px; }
  .foot { display: flex; justify-content: flex-end; gap: 8px; align-items: center; margin-top: 2px; }
  .foot .l { margin-right: auto; font-size: 11.5px; color: var(--muted-foreground); }
  .menu { position: absolute; z-index: 7; width: 300px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 22px 44px -16px rgba(0,0,0,.45); padding: 6px; display: flex; flex-direction: column; }
  .menu .mt { font-size: 11px; color: var(--muted-foreground); padding: 6px 10px 4px; font-weight: 600; }
  .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; }
  .mi.cur { background: var(--ws-soft); }
  .mi .t { flex: 1; min-width: 0; } .mi .t b { display: block; font-weight: 700; }
  .mi .chkm { color: var(--ws); font-weight: 800; }
  .mi.dis { opacity: .6; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }
  .kbd { font-family: "SF Mono", Menlo, monospace; font-size: 10px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

  /* 사무실 미니 그림(모양만) */
  .office { position: relative; border-radius: 12px; overflow: hidden; background: repeating-linear-gradient(90deg, var(--floor) 0 28px, var(--floor2) 28px 29px); border: 1px solid var(--border); flex-shrink: 0; }
  .office .wall { position: absolute; left: 0; right: 0; top: 0; height: 26%; background: var(--wall); border-bottom: 3px solid color-mix(in srgb, var(--ws) 55%, var(--wall)); }
  .office .dk { position: absolute; width: 13%; height: 11%; background: var(--desk); border-radius: 4px; }
  .office .pp { position: absolute; width: 4.2%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); }
  .office .bub { position: absolute; font-size: 10px; background: var(--card); border-radius: 8px; padding: 1px 5px; border: 1px solid var(--border); white-space: nowrap; }
  .office.gray { filter: grayscale(.85) brightness(.92); opacity: .75; }

  .list-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
  .list-row:first-child { border-top: 0; }
  .list-row .t { flex: 1; min-width: 0; } .list-row .t b { font-weight: 700; }
  .slot { border: 1.5px dashed var(--input); border-radius: 12px; padding: 10px; text-align: center; color: var(--muted-foreground); font-size: 12px; }

  /* 3안 선택 화면 카드 */
  .pick { display: flex; gap: 16px; justify-content: center; }
  .pc { width: 168px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
  .pc.hover { border-color: var(--ws); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ws) 22%, transparent), 0 16px 30px -16px rgba(0,0,0,.4); transform: translateY(-3px); }
  .pc .top { height: 6px; background: var(--ws); }
  .pc .in { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .pc.add { border-style: dashed; align-items: center; justify-content: center; color: var(--muted-foreground); gap: 6px; background: transparent; }

  /* ── 휴대폰 ── */
  .phone { width: 390px; height: 800px; border-radius: 30px; overflow: hidden; position: relative; background: var(--background); border: 6px solid #0d0c12; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); display: flex; flex-direction: column; flex-shrink: 0; }
  .sys { height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 600; background: var(--chrome); }
  .sys .cam { width: 9px; height: 9px; border-radius: 50%; background: #000; }
  .phead { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--card); border-bottom: 1px solid var(--border); }
  .phead .ttl { font-size: 17px; font-weight: 800; }
  .pbody { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; min-height: 0; position: relative; overflow: hidden; }
  .pbody .big { font-size: 21px; font-weight: 800; line-height: 1.35; }
  .tabbar { height: 56px; flex-shrink: 0; display: flex; background: var(--card); border-top: 1px solid var(--border); }
  .tabbar span { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; color: var(--muted-foreground); position: relative; }
  .tabbar span i { width: 20px; height: 20px; border-radius: 6px; background: var(--muted); display: block; }
  .tabbar span.on { color: var(--primary); font-weight: 700; } .tabbar span.on i { background: var(--primary); }
  .tabbar .badge { position: absolute; top: 5px; left: 54%; }
  .gest { height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--card); }
  .gest i { width: 96px; height: 4px; border-radius: 2px; background: var(--muted-foreground); opacity: .5; }
  .pdim { position: absolute; inset: 0; background: var(--dim); z-index: 6; display: flex; flex-direction: column; justify-content: flex-end; }
  .bsheet { background: var(--card); border-radius: 20px 20px 0 0; padding: 8px 16px 18px; display: flex; flex-direction: column; gap: 4px; }
  .bsheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--input); margin: 2px auto 8px; }
  .bsheet .h { font-size: 16px; font-weight: 800; padding: 0 2px 6px; }
  .prow { display: flex; gap: 12px; align-items: center; padding: 11px 10px; border-radius: 12px; font-size: 13px; }
  .prow .av { width: 36px; height: 36px; border-radius: 12px; font-size: 14px; }
  .prow.cur { background: var(--ws-soft); }
  .prow .t { flex: 1; min-width: 0; } .prow .t b { display: block; font-size: 14px; }
  .staff { display: flex; gap: 10px; align-items: center; padding: 9px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; font-size: 12.5px; }
  .staff .pf { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; }
  .staff .t { flex: 1; } .staff .t b { display: block; }
  .drawer { position: absolute; left: 0; top: 0; bottom: 0; width: 300px; background: var(--card); z-index: 7; display: flex; box-shadow: 10px 0 30px -10px rgba(0,0,0,.45); }
  .drawer .rail { background: var(--chrome); }
  .drawer .dmain { flex: 1; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }

  table.cmp { border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; font-size: 13px; }
  table.cmp th { background: var(--accent); text-align: left; padding: 9px 12px; font-size: 13px; }
  table.cmp td { padding: 9px 12px; border-top: 1px solid var(--border); vertical-align: top; line-height: 1.55; }
  table.cmp td:first-child { font-weight: 700; color: var(--muted-foreground); white-space: nowrap; }
  table.cmp .rec { background: color-mix(in srgb, var(--primary) 8%, transparent); }
  ol.ask { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px 14px 36px; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; width: 760px; }
  ol.ask li::marker { color: var(--primary); font-weight: 800; }
  ol.ask .s { color: var(--muted-foreground); font-size: 12px; display: block; }
  ol.ask .p { font-size: 11px; font-weight: 800; color: #E5484D; margin-right: 4px; }
  ol.ask .p.m { color: var(--waiting); }
</style>
</head>
<body data-mode="light">
<nav class="tabs-top">
  <a data-s="sum">한눈에 비교</a>
  <a data-s="a">1안 상단 드롭다운형</a>
  <a data-s="b">2안 왼쪽 레일형</a>
  <a data-s="c">3안 사무실 고르기 화면형</a>
  <a data-s="add">추가 마법사 4장 (공통)</a>
  <a data-s="manage">관리·꽉 참·끊김 (공통)</a>
  <a data-s="ask">정리드 확인 목록</a>
  <a class="mode" id="modeBtn">🌙 다크로 보기</a>
</nav>

<section class="sheet" id="sum"></section>
<section class="sheet" id="a"></section>
<section class="sheet" id="b"></section>
<section class="sheet" id="c"></section>
<section class="sheet" id="add"></section>
<section class="sheet" id="manage"></section>
<section class="sheet" id="ask"></section>

<script>
// ───────────────── 데이터 ─────────────────
const WS = {
  home: { name: '집 PC', ch: '집', me: true, st: 'on', last: '지금 보는 중', staff: 6, wait: 2, mac: 'MacBook Pro' },
  work: { name: '회사 PC', ch: '회', st: 'on', last: '연결됨', staff: 9, wait: 3, mac: 'Windows 데스크톱' },
  lab:  { name: '작업실 맥미니', ch: '작', st: 'off', last: '2시간 전', staff: 4, wait: 0, mac: 'Mac mini' },
  note: { name: '노트북', ch: '노', st: 'on', last: '어제', staff: 3, wait: 0, mac: 'MacBook Air' },
}
const DESKS = {
  home: [[10,40],[30,40],[55,40],[75,40],[20,68],[60,68]],
  work: [[8,38],[24,38],[40,38],[60,38],[78,38],[14,66],[32,66],[56,66],[76,66]],
  lab:  [[18,44],[48,44],[72,44],[34,70]],
  note: [[20,46],[50,46],[34,70]],
}
const PCOL = ['#FF7AC6','#7BC8F6','#F6C177','#9BE38A','#C3A6FF','#FF9A7B','#7BE0D0','#E8E07B','#A0B4FF']
const QS = new URLSearchParams(location.search)

// ───────────────── 부품 ─────────────────
const av = (id, o = {}) => `<span class="av ws-${id} ${o.off ? 'off' : ''}" style="${o.s ? `width:${o.s}px;height:${o.s}px;border-radius:${Math.round(o.s / 3)}px;font-size:${Math.round(o.s * .42)}px` : ''}">${WS[id].ch}${o.st ? `<span class="st ${o.st === 'off' ? 'g' : o.st === 'cut' ? 'w' : ''}"></span>` : ''}</span>`
const stTxt = (id, cur) => {
  const w = WS[id]
  if (cur) return `<span class="dot"></span>지금 보는 중`
  if (w.st === 'off') return `<span class="dot g"></span>꺼져 있음 · 마지막 접속 ${w.last}`
  if (w.st === 'cut') return `<span class="dot w"></span>다시 연결하는 중…`
  return `<span class="dot"></span>켜져 있음`
}
function office(id, w, h, o = {}) {
  const ds = DESKS[id].map(([x, y], i) => `<span class="dk" style="left:${x}%;top:${y}%"></span><span class="pp" style="left:${x + 4.5}%;top:${y - 8}%;background:${PCOL[i % PCOL.length]}"></span>`).join('')
  const bub = o.bub === false ? '' : `<span class="bub" style="left:${DESKS[id][1][0] + 6}%;top:${DESKS[id][1][1] - 20}%">💬 보고</span>`
  return `<div class="office ws-${id} ${o.gray ? 'gray' : ''}" style="width:${w}px;height:${h}px"><div class="wall"></div>${ds}${bub}</div>`
}
const staffRows = (n) => [['리드', '정리드', '디자인 시안 검토 중', 'dot'], ['디자', '이디자', '결재 기다리는 중', 'dot w'], ['코드', '박코드', '쉬는 중', 'dot g']].slice(0, n)
  .map(([, nm, s, d], i) => `<div class="staff"><span class="pf" style="background:${PCOL[i + 2]}"></span><div class="t"><b>${nm}</b><span class="xs"><span class="${d}"></span>${s}</span></div><span class="xs">›</span></div>`).join('')

function bar(t) { return `<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>&nbsp; ${t}</div>` }
function sideIcons() { return `<div class="side"><i class="on"></i><i></i><i></i><i></i><i></i></div>` }

// 데스크톱 창: view=지금 보는 PC, left=왼쪽 영역 추가(레일), sw=상단바 왼쪽 칸, ribbon=다른 PC 띠
function win({ view = 'home', w = 760, h = 540, sw = '', left = '', content, overlay = '', ribbon = true, edge = true, title }) {
  const other = view !== 'home'
  const rb = other && ribbon ? `<div class="ribbon ws-${view}">${av(view, { s: 18 })}<span><b>${WS[view].name}</b>의 사무실을 보는 중 · 지시·결재는 ${WS[view].name}에서 처리돼요</span><span class="btn">집 PC로 돌아가기</span></div>` : ''
  const wait = WS[view].wait
  return `<div class="win ws-${view} ${other && edge ? 'edge' : ''}" style="width:${w}px;height:${h}px">${bar(title || `AI Office${other ? ' — ' + WS[view].name : ''}`)}
    ${rb}
    <div class="appbar">${sw}<span class="sp"></span><span class="ib">결재 <span class="badge ${wait ? '' : 'g'}">${wait}</span></span><span class="ib">사용량 42%</span></div>
    <div class="body">${left}${sideIcons()}<div class="content">${content || defaultOffice(view, w - 52 - (left ? 58 : 0) - 32)}</div>${overlay}</div></div>`
}
function defaultOffice(id, cw) {
  return `<div style="display:flex;align-items:center;gap:8px"><b style="font-size:15px">사무실</b><span class="xs">· 직원 ${WS[id].staff}명 · 일하는 중 ${Math.ceil(WS[id].staff / 2)}명</span></div>${office(id, cw, 230)}
  <div style="display:flex;gap:10px">${['정리드 · 보고 2건', '이디자 · 결재 기다림', '박코드 · 쉬는 중'].map((t, i) => `<div class="card" style="flex:1;padding:9px 11px;font-size:12px"><span class="${['dot', 'dot w', 'dot g'][i]}"></span>${t}</div>`).join('')}</div>`
}

// 휴대폰: view=지금 보는 PC
function phone({ view = 'home', head, body, overlay = '', tab = true, ribbon = false }) {
  const rb = ribbon ? `<div class="ribbon ws-${view}" style="height:26px">${av(view, { s: 16 })}<span><b>${WS[view].name}</b> 사무실</span></div>` : ''
  return `<div class="phone ws-${view}"><div class="sys"><span>9:41</span><span class="cam"></span><span>▮▮ 100%</span></div>${rb}
    ${head === null ? '' : `<div class="phead">${head || ''}</div>`}
    <div class="pbody">${body}</div>
    ${tab ? `<div class="tabbar"><span class="on"><i></i>사무실</span><span><i></i>대화</span><span><i></i>결재${WS[view].wait ? `<b class="badge">${WS[view].wait}</b>` : ''}</span><span><i></i>더보기</span></div>` : ''}
    <div class="gest"><i></i></div>${overlay}</div>`
}
function phoneOffice(id, o = {}) {
  return `${office(id, 346, 200, o)}
  <div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px"><span style="font-size:20px">📥</span><div style="flex:1"><b>결재 ${WS[id].wait}건 기다려요</b><div class="xs">${WS[id].name}의 직원이 올렸어요</div></div><span class="btn sm pri">보기</span></div>
  ${staffRows(3)}`
}

function col(tag, title, cap, html, g) { return `<div class="col"><h2><span class="tag ${g ? 'g' : ''}">${tag}</span>${title}</h2>${cap ? `<div class="cap">${cap}</div>` : ''}${html}</div>` }
const sheet = (id, h1, sub, html) => { document.getElementById(id).innerHTML = `<h1 class="st">${h1}</h1><p class="ss">${sub}</p>${html}` }

// ───────────────── 1안 상단 드롭다운형 ─────────────────
const swBtn = (id, open) => `<span class="sw ws-${id} ${open ? 'open' : ''}">${av(id)}<span>${WS[id].name}</span><span class="car">⌄</span></span>`
const ddMenu = (cur) => `<div class="menu" style="left:12px;top:76px">
  <div class="mt">내 사무실 · PC 3대 중 2대 연결</div>
  ${['home', 'work', 'lab'].map((id, i) => `<div class="mi ws-${id} ${id === cur ? 'cur' : ''} ${WS[id].st === 'off' ? 'dis' : ''}">${av(id, { off: WS[id].st === 'off', st: WS[id].st })}<div class="t"><b>${WS[id].name} ${WS[id].me ? '<span class="me">이 PC</span>' : ''}</b><span class="xs">${id === cur ? '지금 보는 중' : WS[id].st === 'off' ? '꺼져 있음 · 마지막 접속 ' + WS[id].last : '켜져 있음 · 직원 ' + WS[id].staff + '명'}</span></div>${WS[id].wait ? `<span class="badge">${WS[id].wait}</span>` : ''}${id === cur ? '<span class="chkm">✓</span>' : `<span class="kbd">⌘${i + 1}</span>`}</div>`).join('')}
  <hr /><div class="mi"><span class="av" style="background:var(--muted);color:var(--primary)">＋</span><div class="t"><b>PC 추가</b><span class="xs">1대 더 연결할 수 있어요</span></div></div>
  <div class="mi"><span class="av" style="background:transparent;color:var(--muted-foreground)">⚙</span><div class="t"><b>PC 관리</b><span class="xs">이름 바꾸기 · 색 · 연결 해제</span></div></div></div>`
const phoneSw = (id) => `<span class="sw ws-${id}" style="height:36px;font-size:15px">${av(id, { s: 26 })}${WS[id].name}<span class="car">⌄</span></span><span style="flex:1"></span><span class="xs">⚙</span>`
const phoneSheet = (cur) => `<div class="pdim"><div class="bsheet"><div class="grab"></div><div class="h">어느 PC를 볼까요?</div>
  ${['home', 'work', 'lab'].map((id) => `<div class="prow ws-${id} ${id === cur ? 'cur' : ''}">${av(id, { off: WS[id].st === 'off', st: WS[id].st })}<div class="t"><b>${WS[id].name}</b><span class="xs">${id === cur ? '<span class="dot"></span>지금 보는 중' : WS[id].st === 'off' ? '<span class="dot g"></span>꺼져 있음 · ' + WS[id].last : '<span class="dot"></span>켜져 있음'}</span></div>${WS[id].wait ? `<span class="badge">${WS[id].wait}</span>` : ''}${id === cur ? '<b style="color:var(--ws)">✓</b>' : ''}</div>`).join('')}
  <div class="small" style="padding:4px 10px 8px">3대 모두 연결했어요. 더 연결하려면 하나를 해제하세요.</div>
  <div style="display:flex;gap:8px"><span class="btn lg" style="flex:1">PC 관리</span><span class="btn lg off" style="flex:1">＋ PC 추가</span></div></div></div>`

sheet('a', '1안 · 상단 드롭다운형 — 왼쪽 위 이름 칸을 눌러 PC를 바꿔요',
  '앱 위쪽 왼쪽에 <b>지금 보는 PC 이름</b>이 늘 보이고, 누르면 목록이 내려옵니다. 다른 PC를 볼 때는 <b>창 맨 위에 그 PC 색 띠</b>가 생기고 창 테두리도 같은 색으로 바뀝니다. 이 PC로 돌아오면 띠가 사라져 평소 화면 그대로입니다. 단축키 ⌘1·⌘2·⌘3(윈도우는 Ctrl).',
  `<div class="row">
    ${col('A-1', '목록 열기 (이 PC 보는 중)', '꺼진 PC는 흐리게, 결재 대기 수는 빨간 숫자. ‘PC 추가’ 아래 남은 자리를 알려 줘요.', win({ view: 'home', sw: swBtn('home', true), overlay: ddMenu('home') }))}
    ${col('A-2', '회사 PC를 보는 중', '띠 · 창 테두리 · 이름 칸이 모두 청록. 사무실·직원·대화·결재가 회사 PC 그대로예요.', win({ view: 'work', sw: swBtn('work') }))}
  </div>
  <div class="row">
    ${col('A-폰1', '휴대폰 · 이름을 눌러 바꾸기', '위쪽 이름 칸 → 아래에서 목록이 올라와요. 3대가 꽉 차면 ‘PC 추가’가 흐려지고 이유를 한 줄로.', phone({ view: 'home', head: phoneSw('home'), body: phoneOffice('home'), overlay: phoneSheet('home') }))}
    ${col('A-폰2', '휴대폰 · 회사 PC를 보는 중', '이름 칸 아래 얇은 색 띠가 늘 붙어 있어요. 왼쪽·오른쪽으로 밀어도 PC가 바뀌게 할 수 있어요(선택).', phone({ view: 'work', ribbon: true, head: phoneSw('work'), body: phoneOffice('work') }))}
    <div class="notes" style="width:420px"><h3>1안 장단점</h3>
      <b class="ok" style="color:var(--working)">장점</b><ul><li>지금 화면 구조를 거의 안 바꿔요. 위쪽에 칸 하나만 생겨요.</li><li>PC와 휴대폰이 같은 모양이라 한 번 익히면 둘 다 써요.</li><li>목록 안에서 꺼진 PC·결재 수를 한 번에 봐요.</li></ul>
      <b style="color:var(--error)">단점</b><ul><li>목록을 열기 전에는 <b>다른 PC에 결재가 쌓였는지</b> 안 보여요(이름 칸 옆 합계 점으로 보완 가능).</li><li>바꾸려면 두 번 눌러야 해요(열기 → 고르기).</li></ul>
      <h3 style="margin-top:8px">새로 필요한 것</h3><ul><li>이름 칸(스위처)·드롭다운·색 띠</li><li>휴대폰 아래 목록 창</li></ul></div>
  </div>`)

// ───────────────── 2안 왼쪽 레일형 ─────────────────
const rail = (cur, o = {}) => `<div class="rail">
  ${['home', 'work', 'lab'].map((id) => `<div class="ri ws-${id} ${id === cur ? 'cur' : ''}">${av(id, { off: WS[id].st === 'off', st: WS[id].st === 'off' ? 'off' : WS[id].st === 'cut' ? 'cut' : '' })}${WS[id].wait && id !== cur ? `<span class="badge">${WS[id].wait}</span>` : ''}</div>${id === 'home' ? '<div class="sep"></div>' : ''}`).join('')}
  <div class="add">＋</div>${o.tip || ''}</div>`
const railTip = `<div class="tip" style="top:116px"><b>작업실 맥미니</b><br />꺼져 있음 · 마지막 접속 2시간 전<br /><span style="opacity:.7">PC를 켜면 다시 볼 수 있어요</span></div>`
const pRail = (cur) => `<div class="rail" style="width:64px;padding-top:16px">${['home', 'work', 'lab'].map((id) => `<div class="ri ws-${id} ${id === cur ? 'cur' : ''}">${av(id, { off: WS[id].st === 'off', st: WS[id].st === 'off' ? 'off' : '' })}${WS[id].wait && id !== cur ? `<span class="badge">${WS[id].wait}</span>` : ''}</div>`).join('')}<div class="add">＋</div></div>`
const pDrawer = (cur) => `<div class="pdim" style="justify-content:flex-start"></div><div class="drawer">${pRail(cur)}<div class="dmain ws-${cur}">
  <div class="xs">지금 보는 PC</div><div style="display:flex;gap:8px;align-items:center">${av(cur, { s: 30 })}<b style="font-size:17px">${WS[cur].name}</b></div>
  <div class="small"><span class="dot"></span>켜져 있음 · 직원 ${WS[cur].staff}명 · 결재 ${WS[cur].wait}건</div>
  <div style="border-top:1px solid var(--border);margin:4px 0"></div>
  ${['사무실', '대화방', '결재함', '업무 보드', '결과물'].map((t, i) => `<div style="display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 2px;${i === 0 ? 'font-weight:700;color:var(--primary)' : ''}"><i style="width:18px;height:18px;border-radius:6px;background:${i === 0 ? 'var(--primary)' : 'var(--muted)'};display:block"></i>${t}</div>`).join('')}
  <div style="margin-top:auto" class="small">PC 3대 연결 · <span class="link">관리</span></div></div></div>`
const pHeadRail = (id) => `<span class="ws-${id}" style="display:flex;gap:10px;align-items:center">${av(id, { s: 30 })}<span class="ttl">${WS[id].name}</span></span><span style="flex:1"></span><span class="badge">5</span><span class="xs" style="margin-left:4px">다른 PC 결재</span>`

sheet('b', '2안 · 왼쪽 세로 레일형 — PC 아이콘이 늘 세로로 줄지어 있어요',
  '메신저 앱처럼 <b>맨 왼쪽에 PC 아이콘 줄</b>을 둡니다. 맨 위가 이 PC, 그 아래 연결한 PC, 맨 아래 ＋. 누르면 바로 바뀌고, <b>다른 PC의 결재 대기 수가 아이콘에 빨간 숫자</b>로 늘 보입니다. 지금 보는 PC는 아이콘 테두리와 왼쪽 막대로 표시하고, 다른 PC일 때는 1안과 같은 색 띠도 붙습니다.',
  `<div class="row">
    ${col('B-1', '이 PC 보는 중 · 꺼진 PC에 마우스 올림', '꺼진 PC는 회색 아이콘. 마우스를 올리면 이름·상태·마지막 접속을 말풍선으로.', win({ view: 'home', left: rail('home', { tip: railTip }), sw: `<b style="font-size:14px">사무실</b>` }))}
    ${col('B-2', '회사 PC를 보는 중', '레일의 회사 PC에 테두리와 막대, 위쪽 색 띠. 집 PC 아이콘에도 결재 수가 보여요.', win({ view: 'work', left: rail('work'), sw: `<b style="font-size:14px">사무실</b>` }))}
  </div>
  <div class="row">
    ${col('B-폰1', '휴대폰 · 왼쪽 위 아이콘을 누르거나 왼쪽 끝에서 밀기', '폭이 좁아 레일을 늘 둘 수 없어요. 서랍 안에 레일 + 메뉴를 같이 둡니다.', phone({ view: 'home', head: pHeadRail('home'), body: phoneOffice('home'), overlay: pDrawer('home') }))}
    ${col('B-폰2', '휴대폰 · 회사 PC를 보는 중', '위쪽 이름 옆에 다른 PC 결재 합계(빨간 숫자)를 늘 보여 줘요.', phone({ view: 'work', ribbon: true, head: pHeadRail('work').replace('5', '2'), body: phoneOffice('work') }))}
    <div class="notes" style="width:420px"><h3>2안 장단점</h3>
      <b style="color:var(--working)">장점</b><ul><li>한 번 눌러 바로 바뀌어요. 가장 빠름.</li><li><b>다른 PC의 결재·상태가 늘 보여서</b> 놓치지 않아요.</li><li>여러 PC를 자주 오가는 사람에게 좋아요.</li></ul>
      <b style="color:var(--error)">단점</b><ul><li>PC 화면 폭을 58px 더 써요. 지금 사이드바(색 띠) 옆에 줄이 하나 더 생겨 복잡해 보일 수 있어요.</li><li>PC를 1대만 쓰는 사람에게도 줄이 보여요(1대일 땐 숨기는 규칙 필요).</li><li>휴대폰은 서랍이라 1안보다 한 번 더 눌러요.</li></ul>
      <h3 style="margin-top:8px">새로 필요한 것</h3><ul><li>왼쪽 레일·말풍선·휴대폰 서랍</li></ul></div>
  </div>`)

// ───────────────── 가짜 QR · 탭 · 모드 ─────────────────
function fakeQr(el) {
  const N = 29, size = +el.dataset.size || 150; let s = [...el.dataset.qr].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0
  const rnd = () => ((s = (s * 1103515245 + 12345) >>> 0) / 4294967296)
  const cv = document.createElement('canvas'); cv.width = N; cv.height = N; cv.style.width = cv.style.height = size + 'px'
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, N, N); g.fillStyle = '#111'
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (rnd() < 0.48) g.fillRect(x, y, 1, 1)
  el.appendChild(cv)
}
document.querySelectorAll('.qr').forEach(fakeQr)
if (QS.has('cap')) document.body.classList.add('capture')
const setMode = (m) => { document.body.dataset.mode = m; document.getElementById('modeBtn').textContent = m === 'dark' ? '☀️ 라이트로 보기' : '🌙 다크로 보기' }
setMode(QS.get('mode') === 'dark' ? 'dark' : 'light')
document.getElementById('modeBtn').addEventListener('click', () => setMode(document.body.dataset.mode === 'dark' ? 'light' : 'dark'))
const show = (id) => {
  document.querySelectorAll('.sheet').forEach((s) => s.classList.toggle('on', s.id === id))
  document.querySelectorAll('.tabs-top a[data-s]').forEach((a) => a.classList.toggle('on', a.dataset.s === id))
}
document.querySelectorAll('.tabs-top a[data-s]').forEach((a) => a.addEventListener('click', () => show(a.dataset.s)))
show(QS.get('sheet') || 'sum')
