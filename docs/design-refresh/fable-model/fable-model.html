<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>페이블 모델 선택 시안</title>
<!-- 디자인 시안 전용(앱 코드 아님). ?mode=light|dark -->
<style>
  [data-mode='light'] {
    --background:#F6F5FB; --foreground:#221F33; --card:#FFFFFF; --primary:#6C5CE7; --primary-foreground:#FFFFFF;
    --muted:#ECEAF6; --muted-foreground:#66627F; --accent:#E9E6FA; --border:#DEDAF0; --input:#CFCAE6; --ring:#8776FF;
    --working:#1C7C46; --waiting:#9A5B00; --sheet-bg:#E4E1F2; --spark-to:#FF7AC6; --grad-end:#A04ED1; --hl:#FF7AC6;
    --dialog-shadow: 0 10px 28px -10px rgba(108,92,231,.28), 0 24px 60px -20px rgba(0,0,0,.25);
  }
  [data-mode='dark'] {
    --background:#14131C; --foreground:#EDEBF8; --card:#201F2D; --primary:#9B8CFF; --primary-foreground:#1A1240;
    --muted:#292739; --muted-foreground:#A7A3C4; --accent:#302D47; --border:#34314A; --input:#413E5C; --ring:#9B8CFF;
    --working:#4ADE80; --waiting:#F2C94C; --sheet-bg:#0C0B12; --spark-to:#FF7AC6; --grad-end:#C884E5; --hl:#FF7AC6;
    --dialog-shadow: 0 10px 28px -10px rgba(0,0,0,.6), 0 24px 60px -20px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--sheet-bg); }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--foreground); padding: 36px 40px 40px; width: max-content; }
  h1.stitle { font-size: 26px; font-weight: 700; }
  p.ssub { color: var(--muted-foreground); font-size: 14px; margin: 6px 0 24px; }
  .row { display: flex; gap: 32px; align-items: flex-start; }
  .col { width: 600px; display: flex; flex-direction: column; gap: 14px; }
  .col h2 { font-size: 18px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--primary); color: var(--primary-foreground); }
  .cap { font-size: 12px; color: var(--muted-foreground); font-weight: 600; margin-bottom: -6px; }
  .pc { font-size: 13px; line-height: 1.55; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; }
  .pc div + div { margin-top: 4px; }
  .plus { color: var(--working); font-weight: 700; } .minus { color: #C42B2B; font-weight: 700; } [data-mode='dark'] .minus { color: #FF6B6B; }
  .unk { color: var(--waiting); font-weight: 700; }

  /* 고용 창 */
  .dlg { background: var(--card); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--dialog-shadow); padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; font-size: 14px;
         background-image: radial-gradient(120% 60% at 50% -10%, color-mix(in oklab, var(--ring) 16%, transparent), transparent 70%); }
  .dlg h3 { font-size: 18px; font-weight: 600; }
  .fade { opacity: .38; }
  .lbl { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .inp { height: 36px; border: 1px solid var(--input); border-radius: 18px; padding: 0 14px; display: flex; align-items: center; color: var(--muted-foreground); font-size: 13px; background: var(--card); }
  .two { display: flex; gap: 24px; align-items: flex-start; }
  .seg { display: inline-flex; background: var(--muted); border-radius: 10px; padding: 2px; }
  .seg span { border-radius: 8px; padding: 5px 11px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .seg span.on { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .hint { font-size: 12px; color: var(--muted-foreground); margin-top: 8px; line-height: 1.45; }
  .hint b { color: var(--foreground); font-weight: 600; }
  .new { font-size: 9.5px; font-weight: 800; letter-spacing: .02em; border-radius: 999px; padding: 1px 6px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--grad-end)); line-height: 14px; }
  .seg span.new { color: #fff; padding: 1px 6px; border-radius: 999px; font-size: 9.5px; font-weight: 800; line-height: 14px; box-shadow: none; }
  .new.soft { background: color-mix(in oklab, var(--primary) 18%, transparent); color: var(--primary); }
  .seg span.new.top, .new.top { background: linear-gradient(135deg, var(--grad-end), var(--spark-to)); }
  .btnrow { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); }
  .btn.p { color: #fff; border: 0; background: linear-gradient(135deg, var(--primary), var(--grad-end)); }
  .langs { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .langs .l { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted-foreground); }
  .langs .l i { font-style: normal; width: 20px; font-weight: 700; }
  .langs .seg span { padding: 4px 9px; font-size: 11px; }

  /* 카드형 모델 목록 */
  .mlist { display: flex; flex-direction: column; gap: 6px; }
  .mi { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 14px; padding: 8px 12px; background: var(--card); }
  .mi.on { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 22%, transparent); }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--input); flex-shrink: 0; }
  .mi.on .radio { border: 5px solid var(--primary); }
  .mi .nm { font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; width: 92px; flex-shrink: 0; }
  .mi .ds { font-size: 12px; color: var(--muted-foreground); flex: 1; }
  .dots { display: flex; gap: 3px; flex-shrink: 0; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); } .dots i.f { background: var(--primary); }
  .dots-cap { font-size: 10.5px; color: var(--muted-foreground); text-align: right; margin-top: -2px; }

  /* 직원 패널 프로필 */
  .panel { display: flex; gap: 16px; align-items: flex-start; }
  .pp { width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; font-size: 13px; }
  .pp .hd { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .av { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(#cfe8d6 0 58%, #d9c3a3 58%); position: relative; flex-shrink: 0; }
  [data-mode='dark'] .av { background: linear-gradient(#2e4a3a 0 58%, #4a3b2c 58%); }
  .av::after { content: ''; position: absolute; left: 14px; top: 9px; width: 12px; height: 15px; border-radius: 6px 6px 3px 3px; background: #e89a7a; box-shadow: 0 -5px 0 -1px #3b2b24; }
  .pp .n { font-weight: 600; display: flex; gap: 6px; align-items: center; } .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--working); }
  .pp .s { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 5px; align-items: center; margin-top: 1px; }
  .chipm { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 7px; line-height: 17px; background: color-mix(in oklab, var(--primary) 16%, transparent); color: var(--primary); }
  .pp .tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .pp .tabs span { padding: 7px 9px; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .pp .tabs span.on { color: var(--foreground); font-weight: 600; border-color: var(--primary); }
  .pp .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld .k { font-size: 12px; color: var(--muted-foreground); font-weight: 600; }
  .sel { height: 34px; border: 1px solid var(--input); border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 6px; background: var(--card); font-size: 13px; }
  .sel.open { border-color: var(--ring); box-shadow: 0 0 0 4px color-mix(in oklab, var(--ring) 24%, transparent); }
  .sel .ch { margin-left: auto; color: var(--muted-foreground); font-size: 11px; }
  .menu { width: 250px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--dialog-shadow); padding: 5px; font-size: 13px; margin-top: 118px; }
  .menu .o { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 9px; }
  .menu .o.on { background: var(--accent); font-weight: 600; }
  .menu .o .d { margin-left: auto; font-size: 11px; color: var(--muted-foreground); font-weight: 400; }
  .menu .sep { height: 1px; background: var(--border); margin: 4px 6px; }
  .menu .grp { font-size: 10.5px; color: var(--muted-foreground); padding: 4px 10px 2px; }
  .note { display: inline-block; background: var(--hl); color: #2a0f20; font-size: 11px; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search)
document.documentElement.dataset.mode = document.body.dataset.mode = q.get('mode') || 'light'
const dark = document.body.dataset.mode === 'dark'

const dlgTop = () => `<h3>직원 고용</h3>
  <div class="fade"><div class="lbl">이름</div><div class="inp">예: 김코드</div></div>
  <div class="fade"><div class="lbl">AI</div><div class="seg"><span class="on">Claude</span><span>GPT</span></div></div>`
const approval = () => `<div><div class="lbl">결재 방식</div><div class="seg"><span class="on">모두 결재</span><span>수정은 자율</span></div></div>`
const bottom = () => `<div class="fade"><div class="lbl">작업 폴더</div><div class="inp">폴더를 고르지 않았어요</div></div><div class="btnrow"><span class="btn">취소</span><span class="btn p">고용하기</span></div>`

const seg = (items, on) => `<div class="seg">${items.map((x, i) => `<span class="${i === on ? 'on' : ''}">${x}</span>`).join('')}</div>`

const V = [
  {
    tag: '시안 1', name: '맨 끝에 추가 + NEW 배지',
    model: () => {
      const items = ['기본', 'Opus', 'Sonnet', 'Haiku', 'Fable <span class="new">NEW</span>']
      return `<div><div class="lbl">모델(성능 등급)</div>${seg(items, 4)}
        <div class="hint"><b>최신 모델</b> · 어려운 일에 가장 똑똑해요 · 느리고 사용량이 많아요</div>
        <div class="langs">
          <div class="l"><i>EN</i>${seg(['Default', 'Opus', 'Sonnet', 'Haiku', 'Fable <span class="new">NEW</span>'], 4)}</div>
          <div class="l"><i>JA</i>${seg(['デフォルト', 'Opus', 'Sonnet', 'Haiku', 'Fable <span class="new">NEW</span>'], 4)}</div>
        </div></div>`
    },
    menu: [['기본 모델', '추천'], ['Opus'], ['Sonnet'], ['Haiku'], ['Fable', '', '<span class="new">NEW</span>']], menuOn: 4, chip: 'Fable',
    pros: '기존 순서·습관을 건드리지 않음, 구현 변화 최소(목록 끝 한 칸)',
    cons: '성능 순서(Opus > Sonnet > Haiku) 뒤에 최상위가 와서 "Haiku보다 가벼운가?"로 오해 가능',
  },
  {
    tag: '시안 2', name: '성능 순 맨 앞 + 최상위 배지',
    model: () => {
      const items = ['기본', 'Fable <span class="new top">최상위</span>', 'Opus', 'Sonnet', 'Haiku']
      return `<div><div class="lbl">모델(성능 등급)</div>${seg(items, 1)}
        <div class="hint"><b>Fable 5.1</b> · 가장 어려운 일에 · 가장 느리고 사용량이 가장 많아요</div>
        <div class="langs">
          <div class="l"><i>EN</i>${seg(['Default', 'Fable <span class="new top">Top</span>', 'Opus', 'Sonnet', 'Haiku'], 1)}</div>
          <div class="l"><i>JA</i>${seg(['デフォルト', 'Fable <span class="new top">最上位</span>', 'Opus', 'Sonnet', 'Haiku'], 1)}</div>
        </div></div>`
    },
    menu: [['기본 모델', '추천'], ['Fable', '가장 똑똑함', '<span class="new top">최상위</span>'], ['Opus'], ['Sonnet'], ['Haiku', '가장 빠름']], menuOn: 1, chip: 'Fable',
    pros: '왼쪽 → 오른쪽 = 똑똑함 → 빠름 순서가 한눈에, 버전(5.1)도 설명에 표시',
    cons: 'Opus 위치가 한 칸 밀려 기존 사용자 손에 익은 자리가 바뀜',
  },
  {
    tag: '시안 3', name: '카드형 목록 (5개 이상 대비)',
    model: () => `<div style="flex:1"><div class="lbl">모델(성능 등급)</div><div class="mlist">
        ${[['기본', '알아서 골라요 (추천)', 0, ''], ['Fable', '가장 어려운 일 · 가장 느림', 5, '<span class="new soft">NEW</span>'], ['Opus', '아주 똑똑해요 · 느리고 사용량이 많아요', 4, ''], ['Sonnet', '똑똑함과 빠르기의 균형', 3, ''], ['Haiku', '가장 빨라요 · 간단한 일에', 1, '']]
          .map(([n, d, k, b], i) => `<div class="mi ${i === 1 ? 'on' : ''}"><span class="radio"></span><span class="nm">${n} ${b}</span><span class="ds">${d}</span>${k ? `<span class="dots">${[1,2,3,4,5].map((x) => `<i class="${x <= k ? 'f' : ''}"></i>`).join('')}</span>` : '<span class="dots" style="width:47px"></span>'}</div>`).join('')}
        </div><div class="dots-cap">● 사용량(많을수록 한도가 빨리 참)</div></div>`,
    approvalBelow: true,
    menu: [['기본 모델', '추천'], ['Fable', '●●●●●', '<span class="new soft">NEW</span>'], ['Opus', '●●●●'], ['Sonnet', '●●●'], ['Haiku', '●']], menuOn: 1, chip: 'Fable', sep: true,
    pros: '설명·사용량을 모두 펼쳐 보여 비개발자도 비교 쉬움, 다음 모델이 나와도 줄만 늘면 됨',
    cons: '고용 창 세로 길이가 약 150px 늘어남, 결재 방식 칸이 아래로 내려감',
  },
]

const panel = (v) => `<div class="panel">
  <div class="pp">
    <div class="hd"><div class="av"></div><div style="flex:1;min-width:0"><div class="n">정리드 <span class="sdot"></span></div><div class="s">개발 리드 · <span class="chipm">${v.chip}</span></div></div></div>
    <div class="tabs"><span>업무</span><span>검토</span><span>장비</span><span class="on">프로필</span></div>
    <div class="body">
      <div class="fld"><span class="k">엔진</span><div class="sel">Claude<span class="ch">▼</span></div></div>
      <div class="fld"><span class="k">모델</span><div class="sel open">${v.chip} ${v.menu[v.menuOn][2] || ''}<span class="ch">▲</span></div></div>
      <div class="fld" style="opacity:.4"><span class="k">직무</span><div class="sel">개발 리드<span class="ch">▼</span></div></div>
    </div>
  </div>
  <div class="menu">${v.menu.map((m, i) => `${v.sep && i === 1 ? '<div class="grp">사용량</div>' : ''}<div class="o ${i === v.menuOn ? 'on' : ''}">${m[0]} ${m[2] || ''}<span class="d">${m[1] || ''}</span></div>${i === 0 ? '<div class="sep"></div>' : ''}`).join('')}</div>
</div>`

document.getElementById('root').innerHTML = `<h1 class="stitle">모델 선택에 페이블(Fable 5.1) 추가 시안</h1>
<p class="ssub">위: 고용 창 → 모델(성능 등급) · 아래: 직원 패널 → 프로필 → 모델 드롭다운과 머리말 표기 · ${dark ? '다크' : '라이트'} 모드 · 흐린 칸은 기존 그대로인 주변 칸</p>
<div class="row">${V.map((v) => `<div class="col">
  <h2><span class="tag">${v.tag}</span>${v.name}</h2>
  <div class="cap">고용 창</div>
  <div class="dlg">${dlgTop()}${v.approvalBelow ? `${v.model()}${approval()}` : `<div class="two">${v.model()}${approval()}</div>`}${bottom()}</div>
  <div class="cap">직원 패널 · 프로필</div>
  ${panel(v)}
  <div class="pc"><div><span class="plus">장점</span> ${v.pros}</div><div><span class="minus">단점</span> ${v.cons}</div></div>
</div>`).join('')}</div>
<p class="ssub" style="margin:18px 0 0"><span class="unk">확인 필요</span> 페이블의 실제 사용량 배율은 조사서에서도 확인되지 않아, "사용량이 많아요"·● 개수는 실측 후 확정합니다. Fable이 들어오면 기존 Opus 설명의 "가장 똑똑해요"는 "아주 똑똑해요"로 바꿔야 겹치지 않습니다. 머리말 표기는 세 시안 모두 "Fable"(버전 숫자는 설명에만).</p>`
</script>
</body>
</html>
