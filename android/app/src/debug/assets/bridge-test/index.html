<!doctype html>
<!-- 디버그 빌드 전용: PC 화면 모바일 빌드(최가독)가 나오기 전에 셸·브리지·SSE를 시험하는 페이지. 릴리스 APK에는 없다 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>브리지 시험</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><b>AI Office · 브리지 시험</b><span id="layout"></span><span id="conn" class="pill">연결 전</span></header>
  <main>
    <section id="staff"><h2>직원 (snapshot 이벤트)</h2><ul id="staffList"><li class="muted">기다리는 중…</li></ul></section>
    <section>
      <h2>호출 (/v2/call)</h2>
      <div class="row">
        <button id="snap">snapshot()</button>
        <button id="pc">pickFolder() — PC 전용</button>
        <button id="qr">regenerateRemoteQr() — 확인 필요</button>
      </div>
      <h2>지시 (입력은 회전해도 남는다)</h2>
      <textarea id="text" rows="3" placeholder="김기획 님에게 지시하기"></textarea>
      <div class="row"><button id="send">instruct('kim', …)</button><input id="file" type="file" accept="image/*"></div>
      <img id="preview" alt="">
    </section>
    <section><h2>기록</h2><ol id="log"></ol></section>
  </main>
  <footer class="composer"><span id="ime" class="muted">키보드 닫힘</span><input id="bottomInput" placeholder="아래 입력창 (키보드 위에 붙어야 함)"></footer>
  <div id="sheet" class="sheet hidden"><p>시트가 열렸어요. 뒤로 가기를 누르면 앱이 아니라 이 시트가 닫혀요.</p><button id="close">닫기</button></div>
  <script src="app.js"></script>
</body>
</html>
