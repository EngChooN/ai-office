<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>AI Office</title>
    <!-- 첫 페인트 전에 바깥 UI 화면 모드·색 테마를 칠한다 (캐시: lib/uiTheme.ts, 규칙: shared/uiTheme.ts resolveMode) -->
    <script id="ui-theme-boot">
      (function () {
        var c = {}
        try { c = JSON.parse(localStorage.getItem('office.uiTheme') || '{}') || {} } catch (e) {}
        var mode = c.mode === 'light' || c.mode === 'dark' ? c.mode : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var theme = /^(lavender|blue|terracotta|sage|rose|mono)$/.test(c.theme) ? c.theme : 'lavender'
        var r = document.documentElement
        r.dataset.mode = mode
        r.dataset.theme = theme
        r.style.colorScheme = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
